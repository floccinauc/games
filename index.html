function nextLevel(){ hide("shopScreen"); level++; levelTime=0; levelKills=0; bossSpawned=false; spawnTimer=0;
  state="playing"; requestWake(); $("hud").classList.remove("hide"); shieldBtn.classList.remove("hide"); $("pauseBtn").classList.remove("hide"); $("abilityBtn").classList.remove("hide"); updateAbilityBtn(); }

/* ---------------- update ---------------- */
function update(dt){
  if(cellTrans.phase!=="none"){ cellTrans.t+=dt; const half=cfg.world.fadeT/2;
    if(cellTrans.phase==="out"&&cellTrans.t>=half){ doCellSwap(cellTrans.dx,cellTrans.dy); cellTrans.phase="in"; cellTrans.t=0; }
    else if(cellTrans.phase==="in"&&cellTrans.t>=half){ cellTrans.phase="none"; }
    return; }   /* sim frozen during fade */
  if(cellTransCd>0)cellTransCd-=dt;
  /* periodic autosave: cell changes and docking already persist, but a long fight in one cell
     could otherwise go unsaved for many minutes */
  autoSaveT-=dt; if(autoSaveT<=0){ autoSaveT=cfg.player.autoSaveEvery; saveRun(); }
  if(P.dockCd>0)P.dockCd-=dt;
  if(P.docked)return;   /* sim freeze while docked */
  levelTime+=dt; totalTime+=dt;
  killFlow=Math.max(0,killFlow-killFlow*cfg.dda.decay*dt); intensity=clamp(1+killFlow/cfg.dda.k,1,cfg.dda.max);
  if(bubbleTime>0)bubbleTime-=dt; if(overTime>0)overTime-=dt;
  doSpawn(dt);   /* WP9: bosses are cell-based, no kill-triggered spawn */
  maintainAsteroids(dt);
  for(let i=asteroids.length-1;i>=0;i--){ const a=asteroids[i]; if(a.dead)continue;
    const Ga=gravityAt(a.x,a.y);
    if(Ga.insideKill){ a.dead=true; continue; }
    a.vx=(a.vx||0)+Ga.vx*dt*0.6; a.vy=(a.vy||0)+Ga.vy*dt*0.6;   /* accumulate: rocks are inertial */
    if(a.vx||a.vy){ a.x+=a.vx*dt; a.y+=a.vy*dt;
      if(a.vx*a.vx+a.vy*a.vy<0.25){a.vx=0;a.vy=0;} }
    if(storm && (a.x<-a.r-140||a.x>worldW+a.r+140||a.y<-a.r-140||a.y>worldH+a.r+140))asteroids.splice(i,1); }
  for(const m of motes){ m.x+=m.vx*dt; m.y+=m.vy*dt;
    if(m.x<0)m.x+=worldW; else if(m.x>worldW)m.x-=worldW; if(m.y<0)m.y+=worldH; else if(m.y>worldH)m.y-=worldH; }

  /* movement */
  let kx=0,ky=0;
  if(keys.w||keys.arrowup)ky-=1; if(keys.s||keys.arrowdown)ky+=1;
  if(keys.a||keys.arrowleft)kx-=1; if(keys.d||keys.arrowright)kx+=1;
  let dvx=0,dvy=0;
  if(kx||ky){const l=Math.hypot(kx,ky);dvx=kx/l*P.speed;dvy=ky/l*P.speed;}
  else if(tilt.on&&tilt.have){ let gx=tilt.gamma-tilt.g0, gy=tilt.beta-tilt.b0;
    if(Math.abs(gx)<tilt.dead)gx=0; if(Math.abs(gy)<tilt.dead)gy=0;
    dvx=clamp(gx/tilt.range,-1,1)*P.speed; dvy=clamp(-gy/tilt.range,-1,1)*P.speed; }
  else if(joy.active){ dvx=joy.vx*P.speed; dvy=joy.vy*P.speed; }
  else if(pointer.active){const psx=(P.x-cam.x)*Z,psy=(P.y-cam.y)*Z,dx=pointer.x-psx,dy=pointer.y-psy,d=Math.hypot(dx,dy);
    if(d>5){dvx=dx/d*P.speed;dvy=dy/d*P.speed;}}
  if(P.frenzySpdMul>1){ dvx*=P.frenzySpdMul; dvy*=P.frenzySpdMul; }   /* WRAITH frenzy */
  if(curBiome==="ice"){ const s=BIOME_FX.ice.slow; dvx*=s; dvy*=s; }  /* ICE: the whole cell is slick */
  if(P.warpMul>1){ dvx*=P.warpMul; dvy*=P.warpMul; }   /* CHRONOS: full speed inside slowed time */
  /* CHRONOS also has to compensate ACCELERATION: with a scaled dt the ship reaches its (already
     scaled-up) target velocity slowly, which measured as ~80% of real-time speed instead of 100%. */
  const t=Math.min(1,P.accel*dt*(P.warpMul>1?P.warpMul:1)); P.vx+=(dvx-P.vx)*t; P.vy+=(dvy-P.vy)*t;
  const G_ply=gravityAt(P.x,P.y); hudPull=G_ply;
  /* ESCAPE GUARANTEE: whatever the field says, the pull the SHIP feels is capped at a fraction of
     its own top speed, so full thrust always makes headway — very slowly at the cap, faster with
     Thruster upgrades. Hull-agnostic: a slow Leviathan gets the same relative margin as a Lancer. */
  let gvx=G_ply.vx, gvy=G_ply.vy;
  { /* Thruster upgrades lower the fraction of your speed a well can cancel — the escape threshold
       the plan asked for. At 0 upgrades a well eats 60% of your thrust; well-upgraded engines cut
       that toward `playerPullFloor`, so deep wells stop being no-go zones as you invest. */
    const thr=(typeof curUps==="function"?(curUps().spd||0):0);
    const frac=Math.max(cfg.gravity.playerPullFloor,
                        (cfg.gravity.playerPullFrac||0.6)-thr*(cfg.gravity.playerPullPerThruster||0.05));
    const gm=Math.hypot(gvx,gvy), lim=P.speed*frac;
    if(gm>lim){ const k=lim/gm; gvx*=k; gvy*=k; } }
  P.x+=(P.vx+gvx)*dt; P.y+=(P.vy+gvy)*dt; clampPlayerEdges();
  /* SWARM: while scattered, everything inside the cloud takes chain-lightning ticks. The damage
     field is the whole cloud (segment ring + zap reach) so it hits "around and between"; bolts are
     drawn FROM the nearest segment so it reads as the segments doing the work. */
  if(P.swarmT>0){
    P.swarmT-=dt; P.swarmSpin=(P.swarmSpin||0)+dt*2.6; P.swarmZapT-=dt;
    if(P.swarmZapT<=0){ P.swarmZapT=P.pSwarmTick||0.12;
      const reach=P.pSwarmR+P.pSwarmZapR, r2=reach*reach, n=P.pSwarmSegs||8;
      for(const e of enemies){ if(e.dead||e.invulnerable)continue;
        const dx=e.x-P.x, dy=e.y-P.y;
        if(dx*dx+dy*dy<r2){
          damageEnemy(e, P.pSwarmZap*P.mDamage, "#8be9ff");
          if(Math.random()<0.4){
            const k=Math.round((Math.atan2(dy,dx)-P.swarmSpin)/(TAU/n)), a=P.swarmSpin+k*TAU/n;
            addEffect({type:"bolt", x1:P.x+Math.cos(a)*P.pSwarmR, y1:P.y+Math.sin(a)*P.pSwarmR,
                       x2:e.x, y2:e.y, life:0.12, max:0.12, color:"#8be9ff"});
          }
        }
      }
    }
    if(P.swarmT<=0){ burst(P.x,P.y,"#8be9ff",18,3.5);
      addEffect({type:"ring",x:P.x,y:P.y,maxR:70,life:0.3,max:0.3,color:"#8be9ff"}); }
  } else if(P.pSwarm && (P.swarmCharge||0)<1){
    P.swarmCharge=Math.min(1,(P.swarmCharge||0)+dt/(P.pSwarmCd||9));
  }
  if(P.blinkCd>0)P.blinkCd-=dt;
  /* CHRONOS: arms itself the moment the hull drops below half. If the cooldown finishes while you
     are ALREADY hurt, it fires immediately rather than waiting for you to be hit again. */
  if(P.pWarp){
    if(P.warpCd>0)P.warpCd-=dt;
    if(P.warpT<=0 && P.warpCd<=0 && P.maxHP>0 && P.hp/P.maxHP<0.5){
      P.warpT=P.pWarpDur; P.warpCd=P.pWarpCd;
      addEffect({type:"ring",x:P.x,y:P.y,maxR:260,life:0.5,max:0.5,color:"#9fd8ff"});
      burst(P.x,P.y,"#9fd8ff",22,4); toast("TIME WARP");
    }
  }
  if(stormGrace>0)stormGrace-=dt;
  updateBiomeHazard(dt);
  updateStormBolts(dt);
  updateClones(dt);
  if(P.shellDecoy){ const s=P.shellDecoy; if(s.flash>0)s.flash-=dt; if(s.dead)P.shellDecoy=null; }
  /* DISTRESS: living raiders grind the station down. Kill them all before the bar empties and the
     station survives AND becomes a permanent friendly port; let it fall and it's razed for the run. */
  if(distress && !distress.done && cellStation){
    const alive=distress.raiders.filter(e=>!e.dead);
    if(alive.length===0){
      distress.done=true;
      capturedStations.add(cellCx+","+cellCy);
      P.specialTokens=(P.specialTokens||0)+cfg.station.distressReward;
      P.distressSaved=(P.distressSaved||0)+1;
      if(P.distressSaved>=3) grantBlueprintsFor("distress");
      addEffect({type:"ring",x:cellStation.x,y:cellStation.y,maxR:220,life:0.7,max:0.7,color:"#4dffa3"});
      toast("STATION SAVED \u2014 Special Token +"+cfg.station.distressReward);
      saveRun();
    } else {
      distress.hp-=cfg.station.distressDps*alive.length*dt;
      if(distress.hp<=0){
        distress.done=true; distress.razed=true;
        destroyedStations.add(cellCx+","+cellCy);
        burst(cellStation.x,cellStation.y,"#ff7a5c",30,5);
        addEffect({type:"ring",x:cellStation.x,y:cellStation.y,maxR:280,life:0.8,max:0.8,color:"#ff7a5c"});
        shakeIt(9); cellStation=null; toast("STATION LOST");
        saveRun();
      }
    }
  }
  /* HYDRA tail follow: serpent chain, velocity-capped so it lags and whips rather than teleporting.
     Gravity acts on each segment, which means a black hole can strip your tail. */
  if(P.pTail && P.tail && P.tail.length){
    const HY=HYDRA, maxStep=HY.maxStep*dt;
    let prev=P;
    for(const s of P.tail){
      if(s.flash>0)s.flash-=dt;
      if(s.dead){ prev=s; continue; }
      const G=gravityAt(s.x,s.y); s.x+=G.vx*dt; s.y+=G.vy*dt;
      const sx=prev.x-s.x, sy=prev.y-s.y, sd=Math.hypot(sx,sy)||1;
      if(sd>HY.spacing){ const move=Math.min(sd-HY.spacing, maxStep); s.x+=sx/sd*move; s.y+=sy/sd*move; }
      if(!Number.isFinite(s.x))s.x=P.x; if(!Number.isFinite(s.y))s.y=P.y;
      prev=s;
    }
  }
  /* KRAKEN ink wake: moving fast lays a corrosive trail behind you */
  if(P.pWake){ const spd=Math.hypot(P.vx,P.vy);
    P.wakeAcc=(P.wakeAcc||0)+spd*dt;
    if(spd>60 && P.wakeAcc>110){ P.wakeAcc=0;
      hazards.push({kind:"cloud",x:P.x,y:P.y,r:P.pWakeR,radius:P.pWakeR,telegraph:0,arm:0,life:P.pWakeLife,max:P.pWakeLife,color:"#7ad6a0",dmg:P.pWake*D.dmg,dot:true,friendly:true}); } }
  if(stationPhysics())return;   /* docked this frame — freeze the sim */
  /* EVENT HORIZON DRAIN (was an instant kill). Drains ~a baseline hull per drainTime seconds, so a
     low/mid-hull ship empties in a constant ~drainTime regardless of its exact max HP. Only a hull
     well above baseHull drains slightly slower (the excess bleeds at a reduced rate). Regen is
     applied normally elsewhere, so a repair-drone ship visibly holds on longer. */
  /* Surviving a horizon is itself an unlock: mark that we were inside, and pay out once we're clear
     and still alive. Set here, resolved below. */
  if(G_ply.insideReh && G_ply.depth>0) P.wasInBH=true;
  if(G_ply.starDepth>0) P.wasInStar=true;
  if(P.wasInBH && !G_ply.insideReh && P.hp>0){ P.wasInBH=false; grantBlueprintsFor("bhole"); }
  if(P.wasInStar && G_ply.starDepth<=0 && P.hp>0){ P.wasInStar=false; grantBlueprintsFor("star"); }
  if(G_ply.insideReh && G_ply.depth>0){
    const D2=cfg.gravity, t=D2.bhDrainTime;
    /* Plateau = the MEDIAN achievable hull, derived from the upgrade registries. Any hull up to the
       median empties in a flat `t` seconds; hull between median and max bleeds at 1/excessFactor,
       so a min-hull ship and a median-hull ship die in the same ~t, and a fully-maxed hull lasts
       proportionally longer. Retuning hull upgrades moves the median, and this tracks it. */
    const env=hullEnvelope(), plateau=env.median;
    const counted=Math.min(P.maxHP, plateau) + Math.max(0, P.maxHP-plateau)/D2.bhExcessFactor;
    /* depth is 0 at the horizon rim and 1 once you are well inside, so grazing the edge stings and
       sitting on the singularity is the full drainTime death. */
    const drain=(counted/t)*G_ply.depth;          /* HP per second */
    P.hp-=drain*dt; P.shield=0; shake=Math.max(shake,6); if(survivorCheck())return;
    if(P.hp<=0){ if(survivorEject())return; P.hp=0; gameOver(); return; }
  }
  if(G_ply.burn>0 && !P.shielding){ P.hp=Math.max(0,P.hp-FIELD.star.burnDps*G_ply.burn*dt); if(P.hp<=0){ gameOver(); return; } }
  /* PHOTOSPHERE: past the corona there is a real capture zone. Unlike the black hole's crush this
     scales with the STAR's own dps rather than your hull, so a big hull genuinely survives longer. */
  if(G_ply.starDepth>0){
    P.hp-=FIELD.star.photoDps*G_ply.starDepth*dt; P.shield=0; shake=Math.max(shake,4); if(survivorCheck())return;
    if(P.hp<=0){ if(survivorEject())return; P.hp=0; gameOver(); return; }
  }
  if(cellTrans.phase==="none"&&cellTransCd<=0){ const HY=cfg.world.edgeHyst; let tdx=0,tdy=0;
    if(P.x>worldW+HY&&cellInGrid(cellCx+1,cellCy))tdx=1; else if(P.x<-HY&&cellInGrid(cellCx-1,cellCy))tdx=-1;
    else if(P.y>worldH+HY&&cellInGrid(cellCx,cellCy+1))tdy=1; else if(P.y<-HY&&cellInGrid(cellCx,cellCy-1))tdy=-1;
    if(tdx||tdy){ cellTrans={phase:"out",t:0,dx:tdx,dy:tdy}; cellTransCd=cfg.world.transCd; } }
  for(const a of asteroids){ if(a.dead)continue; if(a.ramCd>0)a.ramCd-=dt;
    const ax=P.x-a.x,ay=P.y-a.y,ad=Math.hypot(ax,ay)||1,mn=P.radius+a.r;
    if(ad<mn){ P.x=a.x+ax/ad*mn; P.y=a.y+ay/ad*mn;
      /* RAM: rock takes impact damage too — a fast shielded charge cracks asteroids open */
      if(!(a.ramCd>0)){ const rd=ramDamage();
        if(rd>0){ a.ramCd=cfg.player.ram.cd; damageAsteroid(a,rd,P.shielding?"#7cf0ff":"#ffd0a0"); } }
      const nx=ax/ad,ny=ay/ad,vn=P.vx*nx+P.vy*ny,rest=0.72;
      const avx=a.vx||0, avy=a.vy||0, relVn=(P.vx-avx)*nx+(P.vy-avy)*ny;
      if(relVn<-15) hurtPlayer(0.05*(-relVn));   /* impact damage: 0.05 * closing speed; <15 u/s = gentle graze */
      if(vn<0){P.vx-=(1+rest)*vn*nx; P.vy-=(1+rest)*vn*ny;} } }
  updateCamera();
  if(P.invuln>0)P.invuln-=dt; if(P.regen>0&&P.hp<P.maxHP)P.hp=Math.min(P.maxHP,P.hp+P.regen*dt);

  /* shield */
  P.shielding=shieldInput&&P.shield>0;
  /* WRAITH frenzy: the roster's "sharpens as it shrinks" motif, applied to the PLAYER. Missing HP
     buys damage and speed, so a nearly-dead Wraith is the most dangerous thing on the field. */
  { const miss = P.maxHP>0 ? clamp(1-P.hp/P.maxHP,0,1) : 0;
    P.frenzyDmgMul = 1 + (P.pFrenzyDmg||0)*miss;
    P.frenzySpdMul = 1 + (P.pFrenzySpd||0)*miss; }
  if(P.shielding){ if(!P.prevShield)raiseShieldPulse(); P.shield=Math.max(0,P.shield-P.shieldDrain*dt); P.shieldCd=P.shieldDelay; }
  else{ if(P.shieldCd>0)P.shieldCd-=dt; else P.shield=Math.min(P.shieldMax,P.shield+P.shieldRecharge*dt); }
  P.prevShield=P.shielding;

  /* weapons (one per slot) */
  if(!P.shielding) for(const slot of ["main","secondary","tertiary"]){ const id=P.slots[slot]; if(!id)continue; const def=WEAPONS[id];
    if(def.passive)continue; P.wcd[slot]-=dt;
    if(P.wcd[slot]<=0){ const s=def.stats(P.weaponLevels[id]); const sd=P.mDamage; if(overTime>0)P.mDamage*=1.6;
      if(P.frenzyDmgMul>1)P.mDamage*=P.frenzyDmgMul;
      const scd=P.mCooldown; if(P.warpMul>1)P.mCooldown/=P.warpMul;   /* CHRONOS: real-time fire rate */
      def.fire(P,s); P.mDamage=sd; P.wcd[slot]=s.cooldown*P.mCooldown*(overTime>0?0.45:1);
      P.mCooldown=scd; } }   /* restore: the warp scale must not leak past this shot */
  updateSatellites(dt); updateSatWeapon(dt); updateSwFx(dt); updateStrategic(dt); updateMega(dt);
  if(!cellCleared&&spawnedCount>=spawnBudget&&bossesAlive===0){
    let anyAlive=false; for(const e of enemies){ if(!e.dead){ anyAlive=true; break; } }
    if(!anyAlive){ cellCleared=true; clearedCells.add(cellCx+","+cellCy); toast("CELL CLEARED"); } }
  { const mid=P.slots.main, aiming=!P.shielding&&mid&&aimTargets(P.x,P.y,1,WEAPONS[mid].range).length>0;
    if(!aiming&&Math.hypot(P.vx,P.vy)>25) P.dir=Math.atan2(P.vy,P.vx); }

  /* player bullets (hit enemies + asteroids) */
  for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i];
    if(b.homing){ const t=nearestEnemyScoped(b.x,b.y,600); if(t){ const want=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx); let da=want-cur; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU; const na=cur+clamp(da,-b.turn*dt,b.turn*dt),sp=Math.hypot(b.vx,b.vy); b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp; } }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){bullets.splice(i,1);continue;}
    let removed=false;
    for(const e of enemies){ if(e.dead||b.seen.has(e.id))continue;
      if(megaHit(e,b.x,b.y,b.r)){
        /* Bastion shield facet: solid. Damages, then STOPS the shot outright — regardless of
           pierce. Occasionally spits it back (Reflector tech). This is the whole "carve a lane"
           premise; until now bullets sailed straight through and shot the core from anywhere. */
        if(e.arcHalf){ damageEnemy(e,b.dmg,e.type.color);
          if(Math.random()<BASTION.reflectChance){ const sp=280, bd=Math.hypot(b.vx,b.vy)||1;
            ebullets.push({x:b.x,y:b.y,vx:-b.vx/bd*sp,vy:-b.vy/bd*sp,r:5,dmg:8*D.dmg,life:3.5,color:"#7cf0ff"}); }
          else burst(b.x,b.y,e.type.color,4,2);
          bullets.splice(i,1); removed=true; break; }
        if(e.type.kind==="reflect"){ let ad=Math.atan2(b.y-e.y,b.x-e.x)-(e.shieldAng||0); while(ad>Math.PI)ad-=TAU; while(ad<-Math.PI)ad+=TAU;
          if(Math.abs(ad)<e.type.shieldArc){ if(Math.random()<e.type.reflectChance){ const sp=270,bd=Math.hypot(b.vx,b.vy)||1; ebullets.push({x:b.x,y:b.y,vx:-b.vx/bd*sp,vy:-b.vy/bd*sp,r:5,dmg:(e.type.rDmg||14)*D.dmg,life:4}); } else burst(b.x,b.y,e.type.color,4,2);
            bullets.splice(i,1);removed=true;break; } }
        if(e.type.move==="shield"){ let sd=Math.atan2(b.y-e.y,b.x-e.x)-(e.face||0); while(sd>Math.PI)sd-=TAU; while(sd<-Math.PI)sd+=TAU; if(Math.abs(sd)<e.type.shieldArc){ burst(b.x,b.y,e.type.color,3,1.8); bullets.splice(i,1);removed=true;break; } }
        if(e.type.move==="mirror"&&e.mirOn){ if(Math.random()<(e.type.rChance||0.5)){ const a=Math.atan2(P.y-e.y,P.x-e.x),sp=230; ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,dmg:(e.type.rDmg||12)*D.dmg,life:4}); } burst(b.x,b.y,e.type.color,4,2); bullets.splice(i,1);removed=true;break; }
        b.seen.add(e.id); damageEnemy(e,b.dmg,e.type.color);
        b.hits++; if(b.hits>b.pierce){bullets.splice(i,1);removed=true;break;} } }
    if(removed)continue;
    for(const o of asteroids){ if(o.dead||b.seen.has(o.id))continue;
      if((b.x-o.x)**2+(b.y-o.y)**2<(b.r+o.r)**2){ b.seen.add(o.id); damageAsteroid(o,b.dmg,"#cbb");

      } else if(!swarmContact())hurtPlayer(T.dmg*D.dmg);
      const nx=dx/dist,ny=dy/dist,over=e.r+P.radius-dist,ps=T.boss?1:0.5,rest=0.72;
      const pk=Math.min(40,over*ps); P.x+=nx*pk; P.y+=ny*pk;
      clampPlayerEdges();
      if(!T.boss){ const ek=Math.min(40,over*0.5); e.x-=nx*ek; e.y-=ny*ek; e.bx=(e.bx||0)-nx*260; e.by=(e.by||0)-ny*260; }
      const vn=P.vx*nx+P.vy*ny; if(vn<0){P.vx-=(1+rest)*vn*nx; P.vy-=(1+rest)*vn*ny;} } }

  /* enemy bullets */
  const bubR=P.radius+30;
  for(let i=ebullets.length-1;i>=0;i--){ const b=ebullets[i];
    if(b.organic){ b.trail.push(b.x,b.y); if(b.trail.length>10)b.trail.splice(0,2); }
    if(b.homing){ const want=Math.atan2(P.y-b.y,P.x-b.x),cur=Math.atan2(b.vy,b.vx); let da=want-cur; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU; const na=cur+clamp(da,-b.turn*dt,b.turn*dt),sp=Math.hypot(b.vx,b.vy); b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp; }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){ebullets.splice(i,1);continue;}
    let blocked=false; for(const o of asteroids){ if(o.dead)continue; if((b.x-o.x)**2+(b.y-o.y)**2<(b.r+o.r)**2){ damageAsteroid(o,b.dmg,"#cbb"); ebullets.splice(i,1); blocked=true; break; } }
    if(blocked)continue;
    if(bubbleTime>0&&(b.x-P.x)**2+(b.y-P.y)**2<(b.r+bubR)**2){ burst(b.x,b.y,"#aef3ff",3,2);ebullets.splice(i,1);continue; }
    if(P.pReflect && P.shielding && (b.x-P.x)**2+(b.y-P.y)**2<(b.r+P.radius+10)**2){
      /* BULWARK aegis: the shield doesn't just absorb, it throws the shot back — mirroring the
         Bastion's reflective arc plates that this hull is salvaged from. */
      const a=Math.atan2(b.y-P.y,b.x-P.x), sp=Math.hypot(b.vx,b.vy)||260;
      bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*sp*1.25,vy:Math.sin(a)*sp*1.25,r:b.r,
        dmg:(P.pReflectDmg||10)*P.mDamage,life:2.5,color:"#7cf0ff",seen:new Set(),pierce:1,hits:0});
      burst(b.x,b.y,"#7cf0ff",4,2); ebullets.splice(i,1); continue;
    }
    /* HYDRA decoy magnetism: enemy fire near a living segment CURVES into it, then collides with
       the segment before it can ever reach the hull. You watch the tail eat the volley. */
    if(P.pTail){
      const live=hydraLive();
      if(live.length){
        let near=null, nd=HYDRA.drawR*HYDRA.drawR;
        for(const s of live){ const d=(s.x-b.x)**2+(s.y-b.y)**2; if(d<nd){ nd=d; near=s; } }
        if(near){
          const sp=Math.hypot(b.vx,b.vy)||1;
          const want=Math.atan2(near.y-b.y,near.x-b.x);
          let cur=Math.atan2(b.vy,b.vx), da=want-cur;
          while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
          cur+=clamp(da,-HYDRA.drawK*dt,HYDRA.drawK*dt);
          b.vx=Math.cos(cur)*sp; b.vy=Math.sin(cur)*sp;
          if((near.x-b.x)**2+(near.y-b.y)**2<(b.r+HYDRA.r)**2){
            hurtTail(near,b.dmg); burst(b.x,b.y,"#8be9ff",4,2); ebullets.splice(i,1); continue;
          }
        }
      }
    }
    /* while shielding, the bubble (not the hull) is the collision surface */
    const hitR = P.shielding ? shieldRadius() : P.radius;
    if((b.x-P.x)**2+(b.y-P.y)**2<(b.r+hitR)**2){
      if(P.swarmT>0)continue;                       /* scattered: no hull to hit, shots sail through */
      if(P.pPhase){                                 /* loose lattice: some shots thread the gaps */
        if(b._ph===undefined)b._ph=Math.random()<P.pPhase;   /* rolled ONCE per bullet, not per frame */
        if(b._ph)continue;
      }
      if(P.shielding){burst(b.x,b.y,"#36e6ff",4,2);ebullets.splice(i,1);}   /* absorbed at the hull */
      else if(P.invuln<=0){hurtPlayer(b.dmg);ebullets.splice(i,1);} } }

  /* boss hazards (mines + pulsar rings) */
  for(let i=hazards.length-1;i>=0;i--){ const z=hazards[i];
    if(z.kind==="ring"){ z.rad+=z.grow*dt; z.life-=dt; if(z.rad>z.max||z.life<=0){hazards.splice(i,1);continue;}
      const ddx=P.x-z.x,ddy=P.y-z.y,pd=Math.hypot(ddx,ddy);
      if(Math.abs(pd-z.rad)<z.w+P.radius){ let da=Math.atan2(ddy,ddx)-z.gapA; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU; if(Math.abs(da)>z.gapW)hurtPlayer(z.dmg); } continue; }
    z.life-=dt; if(z.arm>0)z.arm-=dt;
    if(z.life<=0){hazards.splice(i,1);continue;}
    if(z.friendly){
      /* KRAKEN wake: a corrosive cloud the PLAYER laid — it burns enemies, never the ship */
      const rr=(z.r||z.radius||60);
      for(const e of enemies){ if(e.dead||e.invulnerable)continue;
        if((e.x-z.x)**2+(e.y-z.y)**2<(rr+e.r)**2) damageEnemy(e, z.dmg*dt, "#7ad6a0"); }
      continue;
    }
    if(z.arm<=0&&(P.x-z.x)**2+(P.y-z.y)**2<(z.radius+P.radius)**2){ explodeHazard(z); hazards.splice(i,1); } }
  const mag=P.magnet*(enemies.some(e=>!e.dead&&e.type.move==="jam"&&onScreen(e))?0.4:1);
  /* cores: gravity + magnet + pickup */
  for(let i=cores.length-1;i>=0;i--){ const c=cores[i]; c.life-=dt; if(c.life<=0){cores.splice(i,1);continue;}
    { const Gp=gravityAt(c.x,c.y); if(Gp.insideKill){ cores.splice(i,1); continue; } c.x+=Gp.vx*dt; c.y+=Gp.vy*dt; }
    const dx=P.x-c.x, dy=P.y-c.y, d=Math.hypot(dx,dy)||1;
    if(d<P.magnet){ const a=1-Math.min(1,d/P.magnet), pull=180+300*a; c.vx+=dx/d*pull*dt; c.vy+=dy/d*pull*dt; }
    c.vx*=Math.exp(-1.6*dt); c.vy*=Math.exp(-1.6*dt); c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=dt*1.4;
    if(d<P.radius+c.r){ const bag=c.kind==="weapon"?P.cores:P.moduleCores; bag[c.id]=(bag[c.id]||0)+1; cores.splice(i,1); floats.push({x:c.x,y:c.y-4,vy:-32,life:0.7,txt:"+"+c.id,color:CORE_COLORS[c.id]||"#eee"}); } }
  for(let i=gems.length-1;i>=0;i--){ const g=gems[i]; { const Gp=gravityAt(g.x,g.y); if(Gp.insideKill){ gems.splice(i,1); continue; } g.x+=Gp.vx*dt; g.y+=Gp.vy*dt; } const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    g.life-=dt; if(g.life<=0){gems.splice(i,1);continue;}
    if(d<mag){const pull=1-d/mag;g.vx+=dx/d*900*pull*dt;g.vy+=dy/d*900*pull*dt;}
    g.vx*=0.9;g.vy*=0.9;g.x+=g.vx*dt;g.y+=g.vy*dt;
    if(d<P.radius+g.r){points+=g.pts;gems.splice(i,1);} }

  /* crates */
  for(let i=crates.length-1;i>=0;i--){ const c=crates[i]; { const Gp=gravityAt(c.x,c.y); if(Gp.insideKill){ crates.splice(i,1); continue; } c.x+=Gp.vx*dt; c.y+=Gp.vy*dt; } const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy)||1;
    if(d<mag*0.6){const pull=1-d/(mag*0.6);c.vx+=dx/d*600*pull*dt;c.vy+=dy/d*600*pull*dt;}
    c.vx*=0.92;c.vy*=0.92;c.x+=c.vx*dt;c.y+=c.vy*dt;
    if(d<P.radius+c.r){applyWeapon(c.weaponId);crates.splice(i,1);} }

  /* power-ups (ability charges) */
  for(let i=powerups.length-1;i>=0;i--){ const u=powerups[i]; { const Gp=gravityAt(u.x,u.y); if(Gp.insideKill){ powerups.splice(i,1); continue; } u.x+=Gp.vx*dt; u.y+=Gp.vy*dt; } const dx=P.x-u.x,dy=P.y-u.y,d=Math.hypot(dx,dy)||1;
    u.life-=dt; if(u.life<=0){powerups.splice(i,1);continue;}
    if(d<mag*0.7){const pull=1-d/(mag*0.7);u.vx+=dx/d*640*pull*dt;u.vy+=dy/d*640*pull*dt;}
    u.vx*=0.92;u.vy*=0.92;u.x+=u.vx*dt;u.y+=u.vy*dt;
    if(d<P.radius+u.r){ if(u.sw)applySatWeapon(u.sw); else giveAbility(u.type); powerups.splice(i,1);} }

  /* token drops (meta currency) */
  for(let i=tokenDrops.length-1;i>=0;i--){ const k=tokenDrops[i]; { const Gp=gravityAt(k.x,k.y); if(Gp.insideKill){ tokenDrops.splice(i,1); continue; } k.x+=Gp.vx*dt; k.y+=Gp.vy*dt; } const dx=P.x-k.x,dy=P.y-k.y,d=Math.hypot(dx,dy)||1;
    k.life-=dt; if(k.life<=0){tokenDrops.splice(i,1);continue;}
    if(d<mag){const pull=1-d/mag;k.vx+=dx/d*820*pull*dt;k.vy+=dy/d*820*pull*dt;}
    k.vx*=0.9;k.vy*=0.9;k.x+=k.vx*dt;k.y+=k.vy*dt;
    if(d<P.radius+k.r){addTokens(1);toast("+1 token");tokenDrops.splice(i,1);} }

  /* asteroids cleanup */
  for(const a of asteroids){ if(a.flash>0)a.flash-=dt; }
  asteroids=asteroids.filter(a=>!a.dead);

  /* particles / floats / effects */
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=effects.length-1;i>=0;i--){effects[i].life-=dt;if(effects[i].life<=0)effects.splice(i,1);}
  updateSinkDebris(dt);
  if(shake>0)shake=Math.max(0,shake-dt*40);

  enemies=enemies.filter(e=>!e.dead);
  /* WP12: legacy shop removed */ if(pendingShop)pendingShop=false;
}

function makeStarField(n,maxR){ const a=[]; for(let i=0;i<n;i++)a.push({x:RNG()*viewW,y:RNG()*viewH,r:rand(.4,maxR),tw:rand(0,TAU),sp:rand(.4,1.3)}); return a; }
/* ---------------- background: composite nebulae, pre-rendered to an offscreen layer ---------------- */
const NEB_PAL=[[300,262],[190,158],[22,346],[215,255],[142,178],[45,8]];
const BIOME_STYLES={
  open:  {pal:NEB_PAL, aniso:null, anisoSt:[1.0,2.2], dustMul:1, filaments:true, vividP:0.35, mote:null},
  dense: {pal:[[30,45],[22,38],[38,52]], aniso:null, anisoSt:[1.0,1.6], dustMul:2, filaments:false, vividP:0.22, mote:{n:36,mode:"drift"}},
  storm: {pal:[[205,225],[214,236],[198,214]], aniso:"stream", anisoSt:[2.4,3.2], dustMul:1, filaments:true, vividP:0.30, mote:{n:44,mode:"streak"}},
  fire:      {pal:[[6,22],[16,34],[350,362]],   aniso:null, anisoSt:[1.0,1.8], dustMul:1, filaments:true,  vividP:0.55, mote:{n:40,mode:"drift"}},
  ice:       {pal:[[185,205],[195,215],[170,190]],aniso:null,anisoSt:[1.0,1.6], dustMul:1, filaments:true,  vividP:0.30, mote:{n:34,mode:"drift"}},
  lightning: {pal:[[250,275],[230,255],[265,285]],aniso:null,anisoSt:[1.0,2.0], dustMul:5, filaments:true,  vividP:0.75, mote:{n:30,mode:"drift"}},   /* thunderheads: heavy cloud banks for the forks to come out of */
  nebula:    {pal:[[280,320],[300,340],[260,300]],aniso:null,anisoSt:[1.2,2.6], dustMul:3, filaments:true,  vividP:0.50, mote:{n:60,mode:"drift"}},
  radiation: {pal:[[70,100],[85,115],[55,85]],   aniso:null, anisoSt:[1.0,1.8], dustMul:2, filaments:false, vividP:0.40, mote:{n:38,mode:"drift"}},
};
function genNebulae(){
  nebulae=[]; nebStars=[];
  const ST=BIOME_STYLES[curBiome]||BIOME_STYLES.open;
  const hsig=rand(0.1,0.25)*Math.min(worldW,worldH);
  nebHot={x:rand(0.15,0.85)*worldW,y:rand(0.15,0.85)*worldH,sig:hsig,boost:1.7};
  const total=13;
  for(let i=0;i<total;i++){
    const nearHot=i>=total-3;
    const cx=nearHot?clamp(nebHot.x+rand(-1,1)*hsig*0.7,0,worldW):rand(0,worldW);
    const cy=nearHot?clamp(nebHot.y+rand(-1,1)*hsig*0.7,0,worldH):rand(0,worldH);
    const S=rand(260,700), pal=ST.pal[randi(0,ST.pal.length-1)];
    const vivid=nearHot||RNG()<ST.vividP;
    let ax,st; if(ST.aniso==="stream"&&storm){ax=Math.atan2(storm.dy,storm.dx);st=rand(ST.anisoSt[0],ST.anisoSt[1]);}else{ax=rand(0,Math.PI);st=rand(ST.anisoSt[0],ST.anisoSt[1]);} const ux=Math.cos(ax), uy=Math.sin(ax);
    const blobs=[],fils=[],dust=[];
    const nb=randi(6,13);
    for(let b=0;b<nb;b++){
      const along=rand(-1,1)*S*st*0.6, perp=rand(-1,1)*S*0.45;
      blobs.push({x:cx+ux*along-uy*perp,y:cy+uy*along+ux*perp,r:S*rand(0.16,0.5),
        hue:pal[0]+(pal[1]-pal[0])*rand(0,1)+rand(-14,14),
        a:vivid?rand(0.10,0.19):rand(0.05,0.10)});
    }
    if(vivid&&ST.filaments){ const nf=randi(2,4);
      for(let f=0;f<nf;f++){ const a0=rand(0,TAU), a1=a0+Math.PI+rand(-1.1,1.1);
        fils.push({x0:cx+Math.cos(a0)*S*rand(0.5,1.0),y0:cy+Math.sin(a0)*S*rand(0.5,1.0),
          x1:cx+Math.cos(a1)*S*rand(0.5,1.0),y1:cy+Math.sin(a1)*S*rand(0.5,1.0),
          mx:cx+rand(-1,1)*S*0.5,my:cy+rand(-1,1)*S*0.5,
          w:rand(10,26),hue:pal[randi(0,1)]+rand(-10,10)}); } }
    const nd=Math.round((vivid?randi(1,2):randi(0,1))*ST.dustMul);
    for(let d=0;d<nd;d++)dust.push({x:cx+rand(-1,1)*S*0.5,y:cy+rand(-1,1)*S*0.5,r:S*rand(0.22,0.42),a:rand(0.18,0.32)});
    nebulae.push({vivid,blobs,fils,dust});
  }
  const ns=randi(2,4);
  for(let i=0;i<ns;i++)nebStars.push({x:clamp(nebHot.x+rand(-1,1)*hsig*0.6,0,worldW),y:clamp(nebHot.y+rand(-1,1)*hsig*0.6,0,worldH),r:rand(1.8,3.4),spike:rand(14,30),hue:rand(0,360)});
}
/* ---------------- space phenomena (rare background features) ---------------- */
const PLANET_PAL=[[28,46],[198,216],[8,24],[95,135],[262,288]];
function pickSpot(list,margin,minD){
  for(let t=0;t<24;t++){ const x=rand(margin,worldW-margin), y=rand(margin,worldH-margin);
    let ok=((x-nebHot.x)**2+(y-nebHot.y)**2)>minD*minD;
    if(ok)for(const s of list){ if((x-s.x)**2+(y-s.y)**2<minD*minD){ok=false;break;} }
    if(ok){ list.push({x,y}); return {x,y}; } }
  const x=rand(margin,worldW-margin), y=rand(margin,worldH-margin); list.push({x,y}); return {x,y};
}
function genPhenomena(){
  phenBack=[];phenFront=[];phenDeep=[];dynPhen=[]; gravWorld=[]; const spots=[];
  const nc=randi(cfg.phen.clusters[0],cfg.phen.clusters[1]);
  for(let i=0;i<nc;i++){ const p=pickSpot(spots,200,650); phenBack.push({k:"cluster",x:p.x,y:p.y,r:rand(60,120),n:randi(28,55)}); }
  let majors=phenRolls().filter(r=>RNG()<r[1]).map(r=>r[0]);
  if(!majors.length)majors=[RNG()<0.5?"planet":"galaxy"];
  /* Shuffle before capping. The old `slice(0,4)` kept the FIRST four in list order, so bhole,
     worm and wall — the tail — were systematically culled whenever the cap bit. */
  for(let i=majors.length-1;i>0;i--){ const j=Math.floor(RNG()*(i+1)); [majors[i],majors[j]]=[majors[j],majors[i]]; }
  if(majors.length>phenMaxMajors())majors=majors.slice(0,phenMaxMajors());
  for(const m of majors){
    if(m==="planet"){ const p=pickSpot(spots,260,700), pal=PLANET_PAL[randi(0,PLANET_PAL.length-1)], r0=rand(70,150);
      const zMin=1.2*r0/CAM_H, z=CAM_H*Math.exp(Math.log(Math.max(zMin,0.15))+RNG()*(Math.log(3.5)-Math.log(Math.max(zMin,0.15))));
      const moons=[]; const nMoon=randi(0,2);
      for(let q=0;q<nMoon;q++) moons.push({ a:rand(0,TAU),
        d:rand(PLANET.moonOrbit[0],PLANET.moonOrbit[1]), mr:rand(PLANET.moonSize[0],PLANET.moonSize[1]),
        w:rand(PLANET.moonSpin[0],PLANET.moonSpin[1])*(RNG()<0.5?1:-1) });
      gravWorld.push({k:"planet",x:p.x,y:p.y,z,r0,hue:rand(pal[0],pal[1]),gas:RNG()<0.6,rings:RNG()<0.45,tilt:rand(-0.5,0.5),moons}); }
    else if(m==="galaxy"){ const p=pickSpot(spots,260,700);
      phenDeep.push({k:"galaxy",x:p.x,y:p.y,r:rand(130,240),tilt:rand(0,Math.PI),sq:rand(0.4,0.85),
        arms:RNG()<0.75?randi(2,3):0,hue:rand(190,280)}); }
    else if(m==="comet"){ dynPhen.push({k:"comet",x:rand(0,worldW),y:rand(0,worldH),
        vx:rand(6,14)*(RNG()<0.5?1:-1),vy:rand(-6,6),r:rand(5,8),hue:rand(185,210)}); }
    else if(m==="pulsar"){ const p=pickSpot(spots,220,600);
      dynPhen.push({k:"pulsar",x:p.x,y:p.y,r:rand(2.5,4),len:rand(120,200),rot:rand(0.25,0.6)*(RNG()<0.5?1:-1),freq:rand(5,9),hue:rand(180,230)}); }
    else if(m==="remnant"){ const p=pickSpot(spots,260,750);
      phenFront.push({k:"remnant",x:p.x,y:p.y,r:rand(120,200),h1:rand(160,200),h2:rand(300,350)}); }
    else if(m==="bhole"){ const p=pickSpot(spots,300,800), r0=rand(34,52);
      const zr=cfg.zDepth.bhole;
      const z=CAM_H*Math.exp(Math.log(zr[0])+RNG()*(Math.log(zr[1])-Math.log(zr[0])));
      gravWorld.push({k:"bhole",x:p.x,y:p.y,z,r0,tilt:rand(-0.45,0.45),spin:RNG()<0.5?1:-1,arms:randi(2,3),sq:rand(0.35,0.85)}); }
    else if(m==="worm"){ const p=pickSpot(spots,260,750); const w={k:"worm",x:p.x,y:p.y,r:rand(46,70),hue:rand(180,290)};
      phenFront.push(w); dynPhen.push({k:"wormRing",x:w.x,y:w.y,r:w.r,hue:w.hue}); }
    else if(m==="star"){ const p=pickSpot(spots,300,800), r0=rand(28,48);
      const zr=cfg.zDepth.star;
      const z=CAM_H*Math.exp(Math.log(zr[0])+RNG()*(Math.log(zr[1])-Math.log(zr[0])));
      gravWorld.push({k:"star",x:p.x,y:p.y,z,r0,hue:rand(35,55),spin:RNG()<0.5?1:-1}); }
    else if(m==="wall"){ phenDeep.push({k:"wall",y0:rand(worldH*0.2,worldH*0.8),amp:rand(120,320),th:rand(90,170),ph:rand(0,TAU),kf:rand(1.2,2.4)}); }
  }
}
function drawCluster(g,c){ g.save(); g.globalCompositeOperation="lighter";
  const gr=g.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r); gr.addColorStop(0,"rgba(190,210,255,0.14)"); gr.addColorStop(1,"rgba(190,210,255,0)");
  g.fillStyle=gr; g.beginPath(); g.arc(c.x,c.y,c.r,0,TAU); g.fill();
  for(let i=0;i<c.n;i++){ const a=rand(0,TAU), d=(rand(0,1)+rand(0,1))*0.5*c.r;
    const x=c.x+Math.cos(a)*d, y=c.y+Math.sin(a)*d, r=rand(0.5,1.6);

/* Long logarithmic spiral arms, drawn under the horizon in viewport space.
     r(t)  = rIn * (armR/rIn)^t          (log-spaced, so samples bunch where curvature is high)
     th(r) = hand * swirl * ln(rOut/r)   (SAME law and handedness as the infall streamlines,
                                          so the streaks flow along the arms, not across them)
   Colour is a function of radius only, so one radial gradient can shade an entire arm in a
   single stroke — white-hot at the horizon, cooling through orange to a violet fade that dies
   right around Rcut, which makes the arms double as a legible marker of the pull's reach. */
function drawBholeArms(p,tnow,sx,sy,s){
  const F=FIELD.bh, armR=F.armR*s, rIn=Math.max(3,p.r0*1.5*s);
  if(armR<=rIn)return;
  const hand=p.spin||1, nArms=p.arms||2, STEPS=56;
  ctx.save();
  ctx.translate(sx,sy); ctx.rotate((p.tilt||0)+tnow*F.armSpin*hand); ctx.scale(1,p.sq||0.6);
  ctx.globalCompositeOperation="lighter"; ctx.lineCap="round"; ctx.lineJoin="round";
  const grad=(mul)=>{ const g=ctx.createRadialGradient(0,0,rIn,0,0,armR);
    g.addColorStop(0.00,`rgba(255,246,224,${0.85*mul})`);
    g.addColorStop(0.12,`rgba(255,196,112,${0.60*mul})`);
    g.addColorStop(0.38,`rgba(255,116,58,${0.32*mul})`);
    g.addColorStop(0.68,`rgba(186,72,132,${0.15*mul})`);
    g.addColorStop(1.00,"rgba(92,40,142,0)"); return g; };
  const glow=grad(0.42), core=grad(1);
  for(let a=0;a<nArms;a++){
    const base=a/nArms*TAU;
    ctx.beginPath();
    for(let i=0;i<=STEPS;i++){
      const t=i/STEPS, r=rIn*Math.pow(armR/rIn,t);
      const th=base+hand*F.swirl*Math.log(armR/r);
      const x=Math.cos(th)*r, y=Math.sin(th)*r;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=glow; ctx.lineWidth=Math.max(3,26*s); ctx.stroke();   // soft body
    ctx.strokeStyle=core; ctx.lineWidth=Math.max(1,6.5*s); ctx.stroke();  // bright filament
  }
  ctx.restore(); ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
}
function drawGravSprite(p,tnow){
  const s=1/(1+p.z/CAM_H), R=p.spriteR*s;
  /* Correct perspective projection: offset from the world point at screen centre, scaled by s,
     re-centred. Reduces to (p.sx-cam.x) at s=1, matching the world block. The old form
     `p.sx - cam.x*s` scaled the camera but not the object, displacing the sprite by
     (1-s)*(p.sx - viewW/2) — up to ~1000+ u — while gravity/minimap used the true plane
     position, so the visible star sat nowhere near the well that was actually pulling you. */
  const sx=(p.sx-cam.x-viewW/2)*s+viewW/2, sy=(p.sy-cam.y-viewH/2)*s+viewH/2;
  /* Cull on the widest thing actually drawn, not on spriteR. Black hole arms reach armR and
     moons orbit past the planet's canvas, so culling on spriteR pops them while still visible. */
  let Rc=R;
  if(p.k==="bhole") Rc=Math.max(R,FIELD.bh.armR*s);
  else if(p.k==="planet"&&p.moons&&p.moons.length)
    Rc=Math.max(R,p.r0*(PLANET.moonOrbit[1]+PLANET.moonSize[1]+0.1)*s);
  if(sx<-Rc||sx>viewW+Rc||sy<-Rc||sy>viewH+Rc)return;
  if(p.k==="bhole")drawBholeArms(p,tnow,sx,sy,s);        /* under the horizon */
  if(p.k==="planet")drawPlanetMoons(p,tnow,sx,sy,s,false); /* far-side moons, behind the planet */
  ctx.drawImage(p.sprite,sx-R,sy-R,R*2,R*2);
  if(p.k==="planet")drawPlanetMoons(p,tnow,sx,sy,s,true);  /* near-side moons, in front */
  if(p.z/CAM_H<0.6){   // shallow → light animation overlay
    if(p.k==="star"){ ctx.save(); ctx.translate(sx,sy);
      const pu=0.8+0.2*Math.sin(tnow*2.4), gr=ctx.createRadialGradient(0,0,0,0,0,p.r0*s*3);
      gr.addColorStop(0,`hsla(${p.hue},95%,85%,${0.35*pu})`); gr.addColorStop(1,"hsla(0,0%,0%,0)");
      ctx.fillStyle=gr; ctx.globalCompositeOperation="lighter"; ctx.beginPath(); ctx.arc(0,0,p.r0*s*3,0,TAU); ctx.fill();
      ctx.restore(); }

let mapViewR=10;  /* zoom: half-window in cells. At 10 the whole 20x20 default fits; [ zooms further out, ] zooms in to a player-centred window for bigger maps. */
function drawWorldMap(){
  const cv=$("mapCanvas"); if(!cv)return; const c=cv.getContext("2d"); const W=cv.width,H=cv.height;
  c.fillStyle="#0a0d18"; c.fillRect(0,0,W,H);
  /* If the whole grid fits in a reasonable window, show ALL of it (so you see the map and where you
     are within it). Only fall back to a player-centred window when the grid is genuinely huge — a
     100x100 can't be 400 legible cells. `span` is the visible width in cells, `origin` its top-left. */
  const full = Math.max(cfg.world.gridW,cfg.world.gridH) <= (2*mapViewR+1);
  const span = full ? Math.max(cfg.world.gridW,cfg.world.gridH) : (2*mapViewR+1);
  const cs=Math.floor(Math.min(W,H)/span), off=(W-cs*span)/2, offY=(H-cs*span)/2;
  const cx0 = full ? 0 : cellCx-mapViewR;
  const cy0 = full ? 0 : cellCy-mapViewR;
  for(let iy=0;iy<span;iy++)for(let ix=0;ix<span;ix++){
    const cx=cx0+ix, cy=cy0+iy;
    if(!cellInGrid(cx,cy))continue;
    const key=cx+","+cy, x=off+ix*cs, y=offY+iy*cs, hasBoss=cellHasBoss(cx,cy), biome=cellBiomeAt(cx,cy);
    const visited=visitedCells.has(key), cleared=clearedCells.has(key);
    let fill="#141a2c";   /* unvisited */
    if(visited)fill="#1a2340";
    if(cleared)fill=biome==="dense"?"#2f3a26":biome==="storm"?"#1e3348":"#1f3852";
    c.fillStyle=fill; c.fillRect(x+1,y+1,cs-2,cs-2);
    /* biome tint corner */
    if(visited||cleared){ c.fillStyle=biome==="dense"?"#8a7040":biome==="storm"?"#6ba0d8":"#5a7ea0";
      c.font='8px ui-monospace,Menlo,monospace'; c.textBaseline="top"; c.textAlign="left"; c.fillText(biome[0].toUpperCase(),x+3,y+3); }
    /* station dot */
    if(cellHasStation(cx,cy)&&(visited||cleared)){
      c.fillStyle=cleared?"#4dffa3":"#ffaa5a"; c.beginPath(); c.arc(x+cs-8,y+8,3,0,TAU); c.fill(); }
    /* mega lair icon (per-lair state via megaStates) */
    { const lk=cellIsLair(cx,cy);
      if(lk){ const st=megaStates[cx+","+cy];
        const glyph=lk==="bastion"?"\u2694":lk==="serpent"?"\u{1F40D}":lk==="squid"?"\u{1F419}":"\u2609";
        c.fillStyle=st&&st.defeated?"#4a6a2a":"#c68eff"; c.font='14px system-ui'; c.textAlign="center"; c.textBaseline="middle";
        c.fillText(glyph,x+cs/2,y+cs/2); } }
    /* boss skull for visited boss cells */
    if(hasBoss&&(visited||cleared)){ c.fillStyle="#ff3040"; c.font='14px ui-monospace,Menlo,monospace'; c.textAlign="center"; c.textBaseline="middle";
      c.fillText("\u2620",x+cs/2,y+cs/2); }
    /* border */
    c.strokeStyle="rgba(90,110,150,0.3)"; c.lineWidth=1; c.strokeRect(x+0.5,y+0.5,cs-1,cs-1);

    if(cx===cellCx&&cy===cellCy){
      c.strokeStyle="#4dffa3"; c.lineWidth=3; c.strokeRect(x+1.5,y+1.5,cs-3,cs-3);

      const sxp=x+clamp(P.x/cfg.world.cellW,0,1)*cs, syp=y+clamp(P.y/cfg.world.cellH,0,1)*cs;
      c.fillStyle="#eaffff"; c.beginPath(); c.moveTo(sxp,syp-cs*0.16); c.lineTo(sxp+cs*0.12,syp+cs*0.1); c.lineTo(sxp-cs*0.12,syp+cs*0.1); c.closePath(); c.fill();
      c.strokeStyle="#36e6ff"; c.lineWidth=1; c.stroke();
    }
    /* a roaming/pursuing mega shows as a moving skull on the map */
    for(const key2 in megaStates){ const st=megaStates[key2]; if(!st||st.defeated)continue;
      if(st.roamCx===cx&&st.roamCy===cy && !(cx===st.cell.cx&&cy===st.cell.cy)){
        c.fillStyle=st.aggro?"#ff3040":"#ff9a5a"; c.font='12px system-ui'; c.textAlign="center"; c.textBaseline="middle";
        c.fillText("\u2620",x+cs/2,y+cs*0.72); } }

  c.fillText("ring "+ringDist(cellCx,cellCy)+" (x"+ringMul(cellCx,cellCy).toFixed(2)+" difficulty)  ·  ☠=boss/mega  green=you",6,H-4);
  c.textAlign="right"; c.fillText("[ / ] zoom",W-6,H-4);
}

    ctx.rotate(tnow*1.4); ctx.beginPath(); ctx.ellipse(0,0,r*1.26,r*0.44,0,0,TAU); ctx.stroke();

function poly(x,y,r,sides,rot){ ctx.beginPath();

function render(){
  ctx.clearRect(0,0,W,H); ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.scale(Z,Z);
  const tnow=performance.now()/1000;

  // ambient backgrounds (world-space under zoom, parallax)
  drawNebulae(tnow);
  drawStars(starFar,0.3,"#8aa0d8",tnow);
  drawStars(starNear,0.6,"#cfe0ff",tnow);

  if(state!=="menu"&&P){
    ctx.save(); ctx.translate(-cam.x,-cam.y);   // world space

    /* FIRE BIOME: a red giant at the centre of the cell. The biome cooks everything in it for
       BIOME_FX.fire.dps with no visible cause; this is the cause. Drawn first, in world space, so
       it sits behind the fight and reads as a landmark you can navigate by. */
    if(curBiome==="fire"){
      const gx=worldW/2, gy=worldH/2, R=760, pu=0.94+0.06*Math.sin(tnow*0.7);
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=4;i>=1;i--){ const rr=R*(0.45+i*0.42)*pu, g=ctx.createRadialGradient(gx,gy,0,gx,gy,rr);
        g.addColorStop(0,`rgba(255,120,50,${0.13/i})`); g.addColorStop(1,"rgba(255,60,20,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(gx,gy,rr,0,TAU); ctx.fill(); }

      cg.addColorStop(0,"rgba(255,226,180,0.95)"); cg.addColorStop(0.35,"rgba(255,138,60,0.85)");
      cg.addColorStop(1,"rgba(190,40,20,0.35)");

        ctx.globalAlpha=0.10; ctx.fillStyle="#ffb066";

    ctx.strokeRect(0,0,worldW,worldH); ctx.shadowBlur=0;

    // station (WP10)

      /* auto-dock range — only meaningful once cleared, so only drawn then */
      if(cellCleared){ ctx.save(); ctx.strokeStyle="rgba(77,255,163,0.20)"; ctx.lineWidth=2; ctx.setLineDash([6,10]);
        ctx.beginPath(); ctx.arc(sx,sy,ST.dockR,0,TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); }
      /* DISTRESS: integrity bar above the station so the timer is legible, plus a warning ring */

        ctx.save();
        ctx.strokeStyle=`rgba(255,90,90,${(0.35+0.35*Math.abs(Math.sin(tnow*4))).toFixed(2)})`;
        ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cellStation.x,cellStation.y,ST.ringR+16,0,TAU); ctx.stroke();
        ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillRect(bx-2,by-2,bw+4,10);
        ctx.fillStyle=f>0.5?"#4dffa3":f>0.25?"#ffce6b":"#ff5a5a"; ctx.fillRect(bx,by,bw*f,6);
        ctx.fillStyle="#eaf2ff"; ctx.font='10px ui-monospace,Menlo,monospace'; ctx.textAlign="center";
        ctx.fillText("STATION INTEGRITY \u00B7 "+distress.raiders.filter(e=>!e.dead).length+" RAIDERS", cellStation.x, by-6);
        ctx.restore();

      ctx.beginPath(); ctx.arc(sx,sy,r,0,TAU); ctx.stroke();
      /* rotating outer ring */
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(totalTime*0.35); ctx.strokeStyle="rgba(180,200,240,0.4)"; ctx.lineWidth=2; ctx.setLineDash([16,12]); ctx.beginPath(); ctx.arc(0,0,r+14,0,TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      /* hub — this is the solid collider, so it must read as solid */
      ctx.setLineDash([]); ctx.fillStyle="#2a3550"; ctx.beginPath(); ctx.arc(sx,sy,ST.hubR,0,TAU); ctx.fill();
      ctx.strokeStyle="rgba(200,220,255,0.8)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy,ST.hubR,0,TAU); ctx.stroke();
      ctx.fillStyle=cellCleared?"#4dffa3":"#ffaa5a"; ctx.font='20px system-ui,Arial'; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("\u2609",sx,sy+1); ctx.restore(); ctx.shadowBlur=0; }
    // motes (biome ambience)
    if(motes.length){ ctx.save(); for(const m of motes){ ctx.globalAlpha=m.al;
      if(m.streak){ ctx.strokeStyle="#bcd4f2"; ctx.lineWidth=m.r; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.vx*0.09,m.y-m.vy*0.09); ctx.stroke(); }
      else { ctx.fillStyle="#b08c60"; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill(); } } ctx.restore(); ctx.globalAlpha=1; }
    // megas (WP14/15/16/17): parent-chrome rendering (parts render via enemy loop)
    if(mega&&mega.cell.cx===cellCx&&mega.cell.cy===cellCy&&!mega.defeated){
      ctx.save();
      if(mega.kind==="bastion"){
        /* LIGHTHOUSE: the warning glow runs 25 degrees AHEAD of the lethal beam, in the direction
           of the sweep. You read where it is going, not where it is. */
        if(mega.lance && mega.lance.on && !mega.core.dead){
          const B2=BASTION, hx=mega.hub.x, hy=mega.hub.y;
          const wa=mega.lance.ang+B2.lanceLead, la=mega.lance.ang;
          ctx.save(); ctx.lineCap="butt";
          ctx.strokeStyle="rgba(255,170,90,0.16)"; ctx.lineWidth=B2.lanceW*0.8;
          ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(wa)*B2.lanceLen,hy+Math.sin(wa)*B2.lanceLen); ctx.stroke();
          ctx.strokeStyle="rgba(255,200,130,0.42)"; ctx.lineWidth=B2.lanceW+14; ctx.shadowBlur=26; ctx.shadowColor="#ffaa5a";
          ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(la)*B2.lanceLen,hy+Math.sin(la)*B2.lanceLen); ctx.stroke();
          ctx.strokeStyle="#fff4e0"; ctx.lineWidth=B2.lanceW*0.45; ctx.shadowBlur=0;
          ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(la)*B2.lanceLen,hy+Math.sin(la)*B2.lanceLen); ctx.stroke();
          ctx.restore();
        }
        /* shield plates: live = solid glowing arc; DEAD = a dim wreck stub that blocks nothing.
           The lane you carve has to be visible or the whole mechanic is invisible. */
        ctx.save(); ctx.lineCap="butt";
        for(const p of mega.parts){
          if(!p.arcHalf)continue;
          const a0=p.curAng-p.arcHalf, a1=p.curAng+p.arcHalf;
          if(p.dead){
            ctx.strokeStyle="rgba(70,92,120,0.35)"; ctx.lineWidth=p.arcThick*0.35;
            ctx.beginPath(); ctx.arc(p.hubX,p.hubY,p.ringR,a0,a1); ctx.stroke();
          } else {
            const lit=p.flash>0;
            ctx.strokeStyle=lit?"#ffffff":"rgba(124,240,255,0.28)"; ctx.lineWidth=p.arcThick+10;
            ctx.beginPath(); ctx.arc(p.hubX,p.hubY,p.ringR,a0,a1); ctx.stroke();
            ctx.strokeStyle=lit?"#ffffff":"#7cf0ff"; ctx.lineWidth=p.arcThick;
            ctx.beginPath(); ctx.arc(p.hubX,p.hubY,p.ringR,a0,a1); ctx.stroke();
            const hpf=clamp(p.hp/p.maxHp,0,1);
            ctx.strokeStyle="rgba(10,16,30,0.55)"; ctx.lineWidth=p.arcThick*0.42;
            ctx.beginPath(); ctx.arc(p.hubX,p.hubY,p.ringR,a0+(a1-a0)*hpf,a1); ctx.stroke();
          }
        }
        ctx.restore();
        for(let ri=0;ri<mega.rings.length;ri++){ const rd=mega.rings[ri];
          ctx.strokeStyle=ri===1?"rgba(124,240,255,0.15)":"rgba(200,220,255,0.08)"; ctx.lineWidth=1;
          ctx.setLineDash([6,10]); ctx.beginPath(); ctx.arc(mega.hub.x,mega.hub.y,rd.r,0,TAU); ctx.stroke(); }
        ctx.setLineDash([]);
        const coreCol=mega.core.invulnerable?"#3a4560":"#ffcc66";
        ctx.shadowBlur=mega.core.invulnerable?0:26; ctx.shadowColor="#ffcc66";
        ctx.fillStyle=coreCol; ctx.beginPath(); ctx.arc(mega.hub.x,mega.hub.y,BASTION.hubR,0,TAU); ctx.fill();
        ctx.strokeStyle=mega.core.invulnerable?"rgba(200,220,255,0.4)":"#ffdd88"; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(mega.hub.x,mega.hub.y,BASTION.hubR,0,TAU); ctx.stroke();
        ctx.shadowBlur=0;
      }
      else if(mega.kind==="serpent"){
        /* draw connective spine between segs */
        ctx.strokeStyle="rgba(139,233,255,0.35)"; ctx.lineWidth=8; ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.beginPath(); const H=mega.head; if(!H.dead){ ctx.moveTo(H.x,H.y);
          for(const s of mega.segs){ if(s.dead)break; ctx.lineTo(s.x,s.y); }
          ctx.stroke(); }
        /* LIGHTNING CONE, two-pass on the SAME stored world-space polylines. The warning is thin
           and flickering; the strike re-renders the identical geometry, thick and white. What you
           were shown IS what hits you — that is the whole contract. */
        const AK=mega.atk;
        /* LASER: thin tracking warning ray, then a thick sustained beam on the SAME angle */
        if(AK && (AK.phase==="laserWarn"||AK.phase==="laserFire") && !mega.head.dead){
          const S2=SERPENT, H2=mega.head, fire=AK.phase==="laserFire";
          const ex=H2.x+Math.cos(AK.ang)*S2.laserLen, ey=H2.y+Math.sin(AK.ang)*S2.laserLen;
          ctx.save(); ctx.lineCap="round";
          if(fire){
            ctx.strokeStyle="rgba(139,233,255,0.35)"; ctx.lineWidth=S2.laserW+16; ctx.shadowBlur=26; ctx.shadowColor="#8be9ff";
            ctx.beginPath(); ctx.moveTo(H2.x,H2.y); ctx.lineTo(ex,ey); ctx.stroke();
            ctx.strokeStyle="#ffffff"; ctx.lineWidth=S2.laserW*0.5; ctx.shadowBlur=0;
            ctx.beginPath(); ctx.moveTo(H2.x,H2.y); ctx.lineTo(ex,ey); ctx.stroke();
          } else {
            const k=0.3+0.5*Math.abs(Math.sin(totalTime*22));
            ctx.strokeStyle=`rgba(139,233,255,${(0.5*k).toFixed(3)})`; ctx.lineWidth=2; ctx.setLineDash([14,10]);
            ctx.beginPath(); ctx.moveTo(H2.x,H2.y); ctx.lineTo(ex,ey); ctx.stroke(); ctx.setLineDash([]);
          }
          ctx.restore();
        }
        if(AK && AK.paths){
          const warn=AK.phase==="warn";
          const k=warn?(0.30+0.50*Math.abs(Math.sin(totalTime*24))):1;
          const trace=()=>{ for(const path of AK.paths){ ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y);
            for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y); ctx.stroke(); } };
          ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";
          ctx.strokeStyle = warn ? `rgba(139,233,255,${(0.16*k).toFixed(3)})` : "rgba(180,240,255,0.50)";
          ctx.lineWidth   = warn ? 10 : 26; trace();                       /* glow pass */
          ctx.strokeStyle = warn ? `rgba(190,245,255,${(0.60*k).toFixed(3)})` : "#ffffff";
          ctx.lineWidth   = warn ? 2 : 5;  trace();                        /* core pass */
          ctx.restore();
        }
      }
      else if(mega.kind==="squid"){
        /* limbs: draw connecting lines */
        ctx.strokeStyle="rgba(198,142,255,0.55)"; ctx.lineWidth=6; ctx.lineCap="round";
        for(const L of mega.limbs){ ctx.beginPath(); ctx.moveTo(mega.body.x,mega.body.y);
          for(const j of L){ if(j.dead)break; ctx.lineTo(j.x,j.y); } ctx.stroke(); }

        if(mega.state==="AIM"){ ctx.strokeStyle="rgba(255,200,100,0.7)"; ctx.lineWidth=2; ctx.setLineDash([6,6]);
          ctx.beginPath(); ctx.moveTo(mega.body.x,mega.body.y); ctx.lineTo(mega.body.x+Math.cos(mega.heading)*300,mega.body.y+Math.sin(mega.heading)*300); ctx.stroke(); ctx.setLineDash([]); }
      }
      else if(mega.kind==="amoeba"){

        /* additive blob field — cells have to read as one organism, not N dots. At 470 cells a
           fresh radial gradient per cell per frame was ~470 allocations/frame; instead each tint
           is baked once into a small sprite (cached on _amoebaBlobCache) and blitted. */

          const rgb=amoebaCol(s,M);

        }
        ctx.restore();
        /* cactus spines: tapered, rigid, hard-edged — deliberately NOT in the soft blob language */
        if(M.spikes&&M.spikes.length){
          ctx.save(); ctx.lineJoin="round";
          for(const sp of M.spikes){
            const ux=Math.cos(sp.ang), uy=Math.sin(sp.ang), px=-uy, py=ux, w=A.spikeR;
            const tx=sp.host.x+ux*sp.len, ty=sp.host.y+uy*sp.len;
            ctx.fillStyle="rgba(226,238,255,0.16)";
            ctx.beginPath(); ctx.moveTo(sp.host.x+px*w*2.0,sp.host.y+py*w*2.0);
            ctx.lineTo(tx,ty); ctx.lineTo(sp.host.x-px*w*2.0,sp.host.y-py*w*2.0); ctx.closePath(); ctx.fill();
            ctx.fillStyle="#dfeaff";
            ctx.beginPath(); ctx.moveTo(sp.host.x+px*w,sp.host.y+py*w);
            ctx.lineTo(tx,ty); ctx.lineTo(sp.host.x-px*w,sp.host.y-py*w); ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
        /* the springs, drawn under strain: stretched runs hot and thin, compressed cold and thick.
           Strain is quantized to 9 buckets so strokeStyle strings are reused rather than rebuilt
           per edge (there can be 1300+), and near-rest edges are batched in one faint pass. */
        ctx.save(); ctx.lineCap="round";
        const inv=1/(A.hexSize*0.55);
        /* pass 1: all the near-rest edges as one path, one style */
        ctx.strokeStyle="rgba(150,110,220,0.26)"; ctx.lineWidth=2.4; ctx.beginPath();
        for(const s of M.all){ if(s.dead)continue;
          for(const n of s.nbr){ if(n.dead)continue;
            if(n.hq<s.hq||(n.hq===s.hq&&n.hr<s.hr))continue;
            const dx=n.x-s.x, dy=n.y-s.y, d=Math.hypot(dx,dy)||1;
            const strain=(d-A.hexSize)*inv;
            if(strain>-0.12&&strain<0.12){ ctx.moveTo(s.x,s.y); ctx.lineTo(n.x,n.y); }
          }
        }
        ctx.stroke();
        /* pass 2: only the strained edges, coloured by quantized bucket */
        for(const s of M.all){ if(s.dead)continue;
          for(const n of s.nbr){ if(n.dead)continue;
            if(n.hq<s.hq||(n.hq===s.hq&&n.hr<s.hr))continue;
            const dx=n.x-s.x, dy=n.y-s.y, d=Math.hypot(dx,dy)||1;
            let strain=(d-A.hexSize)*inv; if(strain<-1)strain=-1; else if(strain>1)strain=1;
            if(strain>-0.12&&strain<0.12)continue;

            ctx.strokeStyle = q>0
              ? `rgba(255,${Math.round(150-90*q)},220,${(0.26+0.5*q).toFixed(2)})`
              : `rgba(150,110,220,${(0.26-0.18*q).toFixed(2)})`;
            ctx.lineWidth=Math.max(1,3.4-2.0*q);
            ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(n.x,n.y); ctx.stroke();
          }

        const M=mega, DD=DREAD, c=Math.cos(M.heading), s=Math.sin(M.heading);
        /* hull spine: a long dark plate from bow to stern */
        const bx=M.x-c*DD.len*0.5, by=M.y-s*DD.len*0.5, ex=M.x+c*DD.len*0.5, ey=M.y+s*DD.len*0.5;
        ctx.save(); ctx.lineCap="round";
        ctx.strokeStyle="rgba(40,52,72,0.9)"; ctx.lineWidth=DD.beam; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
        ctx.strokeStyle="rgba(70,86,116,0.9)"; ctx.lineWidth=DD.beam*0.7; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
        /* LANCE beam/warning along the bow axis */
        const A=M.lance;
        if(A.phase==="warn"||A.phase==="fire"){
          const lx=M.x+c*DD.lanceLen, ly=M.y+s*DD.lanceLen, fire=A.phase==="fire";
          if(fire){ ctx.strokeStyle="rgba(255,224,138,0.4)"; ctx.lineWidth=DD.lanceW+16; ctx.shadowBlur=24; ctx.shadowColor="#ffe08a";
            ctx.beginPath(); ctx.moveTo(M.x,M.y); ctx.lineTo(lx,ly); ctx.stroke();
            ctx.strokeStyle="#fff"; ctx.lineWidth=DD.lanceW*0.5; ctx.shadowBlur=0; ctx.beginPath(); ctx.moveTo(M.x,M.y); ctx.lineTo(lx,ly); ctx.stroke(); }
          else { const k=0.3+0.5*Math.abs(Math.sin(totalTime*20)); ctx.strokeStyle=`rgba(255,224,138,${(0.5*k).toFixed(3)})`; ctx.lineWidth=2; ctx.setLineDash([16,10]);
            ctx.beginPath(); ctx.moveTo(M.x,M.y); ctx.lineTo(lx,ly); ctx.stroke(); ctx.setLineDash([]); }
        }
        ctx.shadowBlur=0;
        /* parts: each drawn as a rounded block, colour by role, dim when dead */
        for(const p of M.parts){
          ctx.fillStyle = p.dead ? "rgba(60,72,92,0.5)" : (p.flash>0?"#fff":p.col);
          ctx.beginPath(); ctx.arc(p.x,p.y,p.w*0.6,0,TAU); ctx.fill();
          if(!p.dead && p.key==="engine"){ ctx.fillStyle="rgba(255,154,90,0.35)"; ctx.beginPath(); ctx.arc(p.x,p.y,p.w*0.9,0,TAU); ctx.fill(); }
          if(!p.dead && p.key==="bridge" && !p.invulnerable){ ctx.strokeStyle="#ffe08a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p.x,p.y,p.w*0.7,0,TAU); ctx.stroke(); }
        }
        /* burn engine flare */
        if(M.mode==="burnTele"||M.mode==="burn"){ const fl=M.mode==="burn"?1:0.5+0.5*Math.abs(Math.sin(totalTime*18));
          ctx.fillStyle=`rgba(255,150,60,${(0.6*fl).toFixed(2)})`;
          ctx.beginPath(); ctx.arc(M.x-c*DD.len*0.5, M.y-s*DD.len*0.5, DD.beam*0.7*fl, 0, TAU); ctx.fill(); }
        ctx.restore();
      }

/* ---------------- loop ---------------- */
let last=performance.now();
let _frameErr=0;
function frame(now){ let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  try{
    /* TIME WARP. The whole simulation is stepped with a scaled dt, so everything — enemies, bullets,
       megabosses, hazards, animations — genuinely crawls. The ship is then handed its time back via
       P.warpMul (movement) and a matching cooldown scale (weapons), which nets out to the player
       acting in real time inside a slowed world. Doing it this way avoids threading a second dt
       through every inline system in update(). warpT itself burns in REAL seconds. */
    let wscale=1;
    if(state==="playing" && P && P.warpT>0){
      P.warpT-=dt;
      wscale=P.pWarpScale||1;
      if(P.warpT<=0){ P.warpT=0; addEffect({type:"ring",x:P.x,y:P.y,maxR:180,life:0.4,max:0.4,color:"#9fd8ff"}); }
    }
    if(P)P.warpMul = wscale<1 ? 1/wscale : 1;
    if(state==="playing")update(dt*wscale);
    render();
  }catch(e){
    /* One bad frame must never kill the loop (that leaves a black screen with a frozen minimap).
       Log sparingly and keep scheduling — the next frame usually recovers. */
    if(_frameErr++<5)console.error("frame error:",e);
  }
  requestAnimationFrame(frame);
}

/* ---------------- persistence ---------------- */
/* RUN PERSISTENCE (WP19). Serialize the whole run to localStorage on cell transition and on dock,
   so a session can be resumed. Kept deliberately compact — the map is procedural, so only DECISIONS
   and PROGRESS need saving (where you are, what you own, what you've cleared/defeated), not geometry. */
const SAVE_KEY="starshard_run";
const SAVE_VERSION=2;   /* bump whenever the shape changes; mismatched saves are rejected, not coerced */
let autoSaveT=0;
function saveRun(){
  try{
    const megaSnap={};
    for(const k in megaStates){ const st=megaStates[k]; if(!st)continue;
      megaSnap[k]={defeated:!!st.defeated, roamCx:st.roamCx, roamCy:st.roamCy, aggro:!!st.aggro}; }
    const s={
      v:SAVE_VERSION, worldSeed, level, points, kills, totalTime,
      cellCx, cellCy,
      visited:[...visitedCells], cleared:[...clearedCells], captured:[...capturedStations],
      megaSnap,
      p:{ maxHP:P.maxHP, satWeapon:P.satWeapon, satWeaponLevels:P.satWeaponLevels,
          cores:P.cores, moduleCores:P.moduleCores, specialTokens:P.specialTokens,
          bastionKilled:!!P.bastionKilled, dreadKilled:!!P.dreadKilled,
          shipBlueprints:P.shipBlueprints||0,
          hullId:P.hullId||"lancer", shipsOwned:P.shipsOwned||{lancer:true},
          hullUpgrades:P.hullUpgrades||{}, blueprints:P.blueprints||{}, distressSaved:P.distressSaved||0,
          /* weapons were never serialised: a resumed run silently reset the loadout to defaults */
          slots:P.slots, weaponLevels:P.weaponLevels,
          /* SURVIVOR run state — the stash is what a station repair rebuilds you from */
          ejected:!!P.ejected, survivorUsed:!!P.survivorUsed, ejectStash:P.ejectStash||null },
      razed:[...destroyedStations]
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(s));
  }catch(e){}
}
function readSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return (s&&s.v===SAVE_VERSION)?s:null; }catch(e){ return null; } }
function hasSave(){ return !!readSave(); }   /* version-aware: an incompatible save counts as none */
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadRun(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s||s.v!==SAVE_VERSION){          /* incompatible: refuse it, and drop it so the button goes */
      clearSave(); if(typeof refreshResumeBtn==="function")refreshResumeBtn();
      toast("Saved run is from an older version \u2014 discarded"); return false; }
    startRun(true);                       /* fresh scaffolding, but don't reset progress below */
    /* the seed must land BEFORE enterCell() below, or the galaxy rebuilds differently */
    if(typeof s.worldSeed==="number")worldSeed=s.worldSeed>>>0;
    level=s.level; points=s.points; kills=s.kills; totalTime=s.totalTime||0;
    visitedCells=new Set(s.visited); clearedCells=new Set(s.cleared); capturedStations=new Set(s.captured||[]);
    P.maxHP=s.p.maxHP; P.hp=s.p.maxHP; P.satWeapon=s.p.satWeapon; P.satWeaponLevels=s.p.satWeaponLevels||{};
    P.cores=s.p.cores||{}; P.moduleCores=s.p.moduleCores||{}; P.specialTokens=s.p.specialTokens||0;
    P.bastionKilled=s.p.bastionKilled; P.dreadKilled=s.p.dreadKilled; P.shipBlueprints=s.p.shipBlueprints||0;
    P.shipsOwned=s.p.shipsOwned||{lancer:true};
    /* the SAVED maxHP/speed already include the hull multipliers, so restore the id as a plain
       field — calling applyHull here would multiply a second time (HP 45 -> 81). Perk FLAGS are
       not stats, so they DO need restoring; and the per-hull upgrade ledger must come back or
       every swapped-out build is lost on reload. */
    P.hullId=s.p.hullId||"lancer";
    P.hullUpgrades=s.p.hullUpgrades||{};
    P.blueprints=s.p.blueprints||{}; P.distressSaved=s.p.distressSaved||0;
    if(s.p.slots)P.slots={...s.p.slots};
    if(s.p.weaponLevels)P.weaponLevels={...s.p.weaponLevels};
    /* ejected is a plain field here for the same reason hullId is: the saved maxHP/speed already
       have the splinter reduction baked in, so re-deriving it would halve a halved hull. */
    P.ejected=!!s.p.ejected; P.survivorUsed=!!s.p.survivorUsed; P.ejectStash=s.p.ejectStash||null;
    destroyedStations=new Set(s.razed||[]);
    applyPerksOnly(P.hullId);
    cellCx=s.cellCx; cellCy=s.cellCy; lastEntryDx=0; lastEntryDy=0;
    enterCell();
    /* re-apply mega defeat/roam snapshot after the cell's megas have been (re)spawned */
    for(const k in s.megaSnap){ const snap=s.megaSnap[k]; if(!megaStates[k])continue;
      megaStates[k].defeated=snap.defeated; megaStates[k].roamCx=snap.roamCx; megaStates[k].roamCy=snap.roamCy; megaStates[k].aggro=snap.aggro; }
    toast("RUN RESUMED");
    return true;
  }catch(e){ return false; }
}
function loadBest(){ try{return parseInt(localStorage.getItem("starshard_best"))||0;}catch(e){return 0;} }
function saveBest(v){ try{localStorage.setItem("starshard_best",String(v));}catch(e){} }
function defaultMeta(){ return {tokens:0, unlocked:{cannon:true,mine:true,rocket:true,lightning:false,laser:false,torpedo:false,satellite:false}, tiers:{minlevel:0,hp:0,dmg:0,treasure:0}}; }
function loadMeta(){ try{ const m=JSON.parse(localStorage.getItem("starshard_meta")); if(!m||typeof m!=="object")return defaultMeta();
    const d=defaultMeta(); return {tokens:m.tokens|0, unlocked:Object.assign(d.unlocked,m.unlocked||{}), tiers:Object.assign(d.tiers,m.tiers||{})}; }catch(e){return defaultMeta();} }
function saveMeta(){ try{localStorage.setItem("starshard_meta",JSON.stringify(meta));}catch(e){} }
function addTokens(n){ meta.tokens+=n; saveMeta(); }

initCellState(0,0);
/* Persist on the way out. Desktop gets beforeunload; mobile browsers frequently kill a background
   tab without ever firing it, so visibilitychange/pagehide are the ones that actually matter. */
function saveOnExit(){ try{ if(state==="playing"||state==="paused")saveRun(); }catch(e){} }
addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")saveOnExit(); });
addEventListener("pagehide",saveOnExit);
addEventListener("beforeunload",saveOnExit);
/* refreshResumeBtn() also runs earlier in the script, but SAVE_KEY is a const declared further
   down: that call hit the temporal dead zone, hasSave()'s try/catch swallowed the ReferenceError,
   and the Resume button was therefore ALWAYS hidden on a fresh load. Re-run it here, after every
   declaration exists. */
refreshResumeBtn();
resize(); requestAnimationFrame(frame);
</script>
