<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>STARSHARD</title>
<style>
  :root{
    --void-deep:#060912; --panel:rgba(11,18,36,.86);
    --cyan:#36e6ff; --cyan-dim:#1a7d94; --gold:#ffd84d; --danger:#ff3b5c;
    --text:#dce8ff; --dim:#7d8bb0;
    --label:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:600 15px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--void-deep);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #game{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
    background:radial-gradient(130% 100% at 50% 40%,#0c1428 0%,#070b18 55%,#04060e 100%);touch-action:none}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .hud-top{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:center;gap:24px;align-items:baseline;text-shadow:0 1px 6px #000}
  .stat{text-align:center}
  .stat-num{font:var(--mono);font-size:21px;letter-spacing:.5px;color:var(--text)}
  .stat-lab{font:var(--label);font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);display:block;margin-top:3px}
  .stat.lvl .stat-num{color:var(--cyan)} .stat.pts .stat-num{color:var(--gold)}
  .stat.boss.active .stat-num{color:var(--danger)} .stat.boss.active .stat-lab{color:var(--danger)}

  #weapons{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 58px);left:max(12px,env(safe-area-inset-left));
    display:flex;flex-direction:column;gap:5px}
  .wchip{display:flex;align-items:center;gap:6px;background:rgba(11,18,36,.55);border:1px solid rgba(54,230,255,.18);
    border-radius:8px;padding:4px 8px 4px 6px;backdrop-filter:blur(3px)}
  .wchip .wi{font-size:15px;line-height:1}
  .wchip .wl{font:var(--label);font-size:10px;letter-spacing:1px;color:var(--cyan)}
  .wchip.empty{opacity:.4}

  .vitals{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;width:min(460px,84vw)}
  .vital-row{display:flex;align-items:center;gap:9px}
  .vital-ico{font-size:15px;width:18px;text-align:center}
  .bar{flex:1;height:16px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .bar > i{position:absolute;inset:0;transform-origin:left;border-radius:8px;transition:transform .08s linear}
  .bar-text{position:absolute;inset:0;display:grid;place-items:center;font:var(--mono);font-size:11px;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:.5px}
  #hpFill{background:linear-gradient(90deg,#ff3b5c,#ff7a9a)}
  #shFill{background:linear-gradient(90deg,var(--cyan),#aef3ff)}

  .ctrl-btn{position:fixed;z-index:6;display:grid;place-items:center;
    border:1.5px solid var(--cyan-dim);color:var(--cyan);background:rgba(11,18,36,.5);
    backdrop-filter:blur(4px);font:var(--label);text-transform:uppercase;letter-spacing:1.5px}
  #shieldBtn{right:max(22px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 70px);
    width:94px;height:94px;border-radius:50%;box-shadow:0 0 24px rgba(54,230,255,.18),inset 0 0 18px rgba(54,230,255,.12)}
  #shieldBtn:active,#shieldBtn.on{background:rgba(54,230,255,.22);box-shadow:0 0 36px rgba(54,230,255,.5),inset 0 0 24px rgba(54,230,255,.3)}
  #shieldBtn .ico{font-size:30px}
  #abilityBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;
    left:max(22px,env(safe-area-inset-left));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 70px);
    width:78px;height:78px;border-radius:50%;border-color:#7a6cff;color:#cdd6ff;position:relative;
    box-shadow:0 0 22px rgba(122,108,255,.22),inset 0 0 16px rgba(122,108,255,.14)}
  #abilityBtn:active:not(.empty){background:rgba(122,108,255,.24);box-shadow:0 0 34px rgba(122,108,255,.5)}
  #abilityBtn.empty{opacity:.32}
  #abilityBtn .ico{font-size:26px;line-height:1}
  #abilityBtn .ab-name{font-size:7.5px;letter-spacing:1px;margin-top:1px;opacity:.85}
  #abilityBtn .ab-count{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;
    background:#7a6cff;color:#fff;font:700 11px/20px system-ui;text-align:center;box-shadow:0 0 8px rgba(122,108,255,.6)}
  #pauseBtn{top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
    width:42px;height:42px;border-radius:10px;font-size:16px}

  .screen{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:safe center;padding:24px;text-align:center;overflow-y:auto;
    background:radial-gradient(120% 90% at 50% 30%,rgba(13,23,48,.82),rgba(4,6,14,.95));backdrop-filter:blur(3px)}
  .screen.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .title{font-size:clamp(46px,13vw,104px);font-weight:800;letter-spacing:.14em;color:var(--cyan);
    text-shadow:0 0 30px rgba(54,230,255,.55),0 0 6px rgba(54,230,255,.8);margin-bottom:6px}
  .tagline{font:var(--label);letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-bottom:30px}
  .screen h2{font-size:clamp(24px,6.5vw,38px);font-weight:800;letter-spacing:.07em;margin-bottom:8px}
  .controls{font-size:15px;color:var(--dim);line-height:1.85;margin-bottom:28px;max-width:350px}
  .controls b{color:var(--text);font-weight:600}
  .controls .key{display:inline-block;border:1px solid var(--cyan-dim);border-radius:5px;padding:1px 7px;
    color:var(--cyan);font:var(--mono);font-size:12px;margin:0 1px}
  .diff-row{display:flex;gap:10px;margin-bottom:24px}
  .diff{pointer-events:auto;cursor:pointer;border:1.5px solid var(--cyan-dim);color:var(--dim);background:rgba(11,18,36,.5);
    border-radius:10px;padding:11px 22px;font:var(--label);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;transition:.16s}
  .diff.selected{border-color:var(--cyan);color:var(--cyan);background:rgba(54,230,255,.12);box-shadow:0 0 16px rgba(54,230,255,.2)}
  .btn{pointer-events:auto;cursor:pointer;border:1.5px solid var(--cyan);color:var(--cyan);background:transparent;
    border-radius:11px;padding:14px 42px;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;transition:.16s}
  .btn:hover,.btn:active{background:var(--cyan);color:#04101a;box-shadow:0 0 28px rgba(54,230,255,.5)}
  .btn.ghost{border-color:var(--dim);color:var(--dim)} .btn.ghost:hover{background:var(--dim);color:#0a0e1a;box-shadow:none}
  .stats-grid{display:flex;gap:30px;margin:16px 0 28px;flex-wrap:wrap;justify-content:center}
  .stats-grid .v{font:var(--mono);font-size:34px;color:var(--cyan)}
  .stats-grid .l{font:var(--label);font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);margin-top:4px}
  .best{font:var(--label);letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-top:24px}
  .best b{color:var(--gold)}

  #shopScreen h2{color:var(--gold);text-shadow:0 0 22px rgba(255,216,77,.4)}
  .balance{font:var(--mono);font-size:30px;color:var(--gold);margin:4px 0 20px;letter-spacing:1px}
  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:760px}
  .card{pointer-events:auto;cursor:pointer;width:172px;min-height:178px;border-radius:14px;background:var(--panel);
    border:1px solid rgba(54,230,255,.22);padding:18px 14px;display:flex;flex-direction:column;align-items:center;
    gap:8px;transition:.16s;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
  .card.weapon::before{background:var(--gold)}
  .card:hover:not(.disabled){transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 20px rgba(54,230,255,.22)}
  .card.disabled{opacity:.4;cursor:not-allowed}
  .card .ic{font-size:34px;margin-top:2px}
  .card .nm{font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;color:var(--text)}
  .card .ds{font-size:12.5px;color:var(--dim);line-height:1.4}
  .card .tag{font:var(--label);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);opacity:.85}
  .card .cost{margin-top:auto;font:var(--mono);font-size:15px;color:var(--gold)}
  .st-tab.active{background:rgba(122,108,255,0.28);border-color:#7a6cff;color:#eef}
  .st-tab[disabled]{opacity:0.35;cursor:not-allowed}
  .st-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(20,30,50,0.5);border:1px solid rgba(140,160,200,0.15);border-radius:8px;margin-bottom:8px}
  .st-row .ic{font-size:22px;width:32px;text-align:center}
  .st-row .nm{flex:1;text-align:left}
  .st-row .cost{font-family:var(--mono);color:var(--gold);min-width:80px;text-align:right}
  .st-row .lv{font-family:var(--mono);opacity:0.7;font-size:12px;min-width:60px;text-align:right}
  .st-row button{padding:6px 14px;font-size:13px}
  .st-row.locked{opacity:0.5}
  @media (max-width:520px){
    .screen{padding:20px 12px}
    .cards{gap:10px;max-width:100%}
    .card{width:calc(50% - 6px);min-height:158px;padding:14px 10px}
    .card .ic{font-size:30px} .card .nm{font-size:12px} .card .ds{font-size:11.5px} .card .cost{font-size:14px}
  }
  .shop-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px;align-items:center}
  .mini{pointer-events:auto;cursor:pointer;border:1.5px solid var(--cyan-dim);color:var(--cyan);background:rgba(11,18,36,.5);
    border-radius:10px;padding:12px 22px;font:var(--label);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;transition:.16s}
  .mini:hover:not(:disabled){background:rgba(54,230,255,.15)} .mini:disabled{opacity:.4;cursor:not-allowed}

  #toast{position:fixed;top:23%;left:50%;transform:translateX(-50%);z-index:15;
    font-size:clamp(19px,4.6vw,28px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--danger);text-shadow:0 0 24px rgba(255,59,92,.6);pointer-events:none;opacity:0;text-align:center}
  #toast.show{animation:toast 2.6s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}14%,72%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px)}}
  .hide{display:none!important}
  @media (max-width:560px){.hud-top{gap:16px}.stat-num{font-size:18px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hide">
  <div class="hud-top">
    <div class="stat lvl"><span id="lvlVal" class="stat-num">1</span><span class="stat-lab">Level</span></div>
    <div class="stat boss" id="bossStat"><span id="bossVal" class="stat-num">0:35</span><span id="bossLab" class="stat-lab">Boss In</span></div>
    <div class="stat pts"><span id="ptsVal" class="stat-num">0</span><span class="stat-lab">Shards</span></div>
    <div class="stat"><span id="killVal" class="stat-num">0</span><span class="stat-lab">Kills</span></div>
  </div>
  <div id="weapons"></div>
  <div class="vitals">
    <div class="vital-row"><span class="vital-ico">&#10084;</span><div class="bar"><i id="hpFill"></i><span id="hpText" class="bar-text">100</span></div></div>
    <div class="vital-row"><span class="vital-ico">&#128737;</span><div class="bar"><i id="shFill"></i></div></div>
  </div>
</div>

<button id="abilityBtn" class="ctrl-btn hide empty"><span class="ico" id="abIco">&#9889;</span><span class="ab-name" id="abName"></span><span class="ab-count" id="abCount" style="display:none">0</span></button>
<button id="shieldBtn" class="ctrl-btn hide"><span class="ico">&#128737;</span></button>
<button id="pauseBtn" class="ctrl-btn hide">&#9208;</button>
<div id="toast"></div>

<div id="startScreen" class="screen show">
  <div class="title">STARSHARD</div>
  <div class="tagline">Drift &middot; Auto-fire &middot; Survive</div>
  <div class="controls" id="ctrlHint"></div>
  <div class="diff-row" id="diffRow">
    <button class="diff" data-d="easy">Easy</button>
    <button class="diff selected" data-d="normal">Normal</button>
    <button class="diff" data-d="hard">Hard</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center">
    <button id="tiltBtn" class="btn ghost" style="flex:1 1 28%;margin:0;min-width:92px">Tilt: OFF</button>
    <button id="fsBtn" class="btn ghost" style="flex:1 1 28%;margin:0;min-width:92px">Fullscreen</button>
    <button id="musicBtn" class="btn ghost" style="flex:1 1 28%;margin:0;min-width:92px">Music: ON</button>
  </div>
  <button id="playBtn" class="btn">Launch</button>
  <button id="menuResumeBtn" class="btn ghost" style="margin-top:12px;display:none">Resume Run</button>
  <button id="hangarBtn" class="btn ghost" style="margin-top:12px">Hangar &#9670; <span id="startTokens">0</span></button>
  <button id="equipBtnStart" class="btn ghost" style="margin-top:12px">Equipment</button>
  <div class="best" id="startBest"></div>
</div>

<div id="shopScreen" class="screen">
  <h2 id="shopTitle">Outpost</h2>
  <div class="balance">&#9670; <span id="shopBal">0</span></div>
  <div class="cards" id="shopCards"></div>
  <div class="shop-actions">
    <button id="rerollBtn" class="mini">Reroll</button>
    <button id="repairBtn" class="mini">Repair Hull</button>
    <button id="shopHangarBtn" class="mini">Hangar &#9670; <span id="shopTokens">0</span></button>
    <button id="nextBtn" class="btn">Next Level</button>
  </div>
</div>

<div id="stationScreen" class="screen">
  <h2>Station</h2>
  <div id="stationTabs" style="display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap;justify-content:center">
    <button class="btn ghost st-tab" data-tab="weapons">Weapons</button>
    <button class="btn ghost st-tab" data-tab="modules">Modules</button>
    <button class="btn ghost st-tab" data-tab="upgrades">Upgrades</button>
    <button class="btn ghost st-tab" data-tab="swap">Swap</button>
    <button class="btn ghost st-tab" data-tab="repair">Repair</button>
    <button class="btn ghost st-tab" data-tab="equip">Equipment</button>
    <button class="btn ghost st-tab" data-tab="hangar">Hangar</button>
    <button class="btn ghost st-tab" data-tab="ships">Ships</button>
  </div>
  <div id="stationBody" style="min-width:280px;max-width:640px;width:100%"></div>
  <button id="undockBtn" class="btn" style="margin-top:16px">Undock</button>
</div>
<div id="equipScreen" class="screen">
  <h2>Equipment</h2>
  <div id="equipBody" style="min-width:280px;max-width:640px;width:100%"></div>
  <div class="shop-actions"><button id="equipBackBtn" class="btn">Back</button></div>
</div>

<div id="pauseScreen" class="screen">
  <h2>Paused</h2>
<canvas id="mapCanvas" width="360" height="360" style="display:none;background:#0a0d18;border:1px solid #2a3350;margin-top:12px;image-rendering:pixelated"></canvas>
  <button id="mapBtn" class="btn ghost" style="margin-top:16px">Show Map</button>
  <button id="resumeBtn" class="btn" style="margin-top:12px">Resume</button>
  <button id="equipBtnPause" class="btn ghost" style="margin-top:12px">Ship Status</button>
  <button id="restartBtn" class="btn ghost" style="margin-top:12px">Restart Run</button>
  <button id="quitBtn" class="btn ghost" style="margin-top:12px">Main Menu</button>
</div>

<div id="overScreen" class="screen">
  <h2 style="color:var(--danger);text-shadow:0 0 22px rgba(255,59,92,.4)">Ship Destroyed</h2>
  <div class="stats-grid">
    <div><div class="v" id="ovLevel">1</div><div class="l">Reached</div></div>
    <div><div class="v" id="ovKills">0</div><div class="l">Kills</div></div>
    <div><div class="v" id="ovTime">0:00</div><div class="l">Survived</div></div>
    <div><div class="v" id="ovTokens">0</div><div class="l">Tokens</div></div>
  </div>
  <button id="againBtn" class="btn">Launch Again</button>
  <div class="best" id="overBest"></div>
</div>

<div id="metaScreen" class="screen">
  <h2 id="metaTitle">Hangar</h2>
  <div class="balance">&#9670; <span id="metaBal">0</span> <span style="font-size:13px;color:var(--dim);letter-spacing:2px">TOKENS</span></div>
  <div class="cards" id="metaCards"></div>
  <div class="shop-actions"><button id="metaBackBtn" class="btn">Back</button></div>
</div>

<script>
"use strict";
/* ================================================================
   STARSHARD v3 - bigger world + camera, asteroids, ambiance
   CONFIG: every tunable lives in `cfg` and the WEAPONS stat fns.
   ================================================================ */
/* ---------------- DEBUG ----------------
   One switch for the "let me actually see the content" mode:
     - the run starts on a RANDOM owned hull instead of the Lancer, so every build can be tried
       without grinding tokens for each one;
     - space phenomena roll far more often, so wells/stars/anomalies are easy to find and test.
   Set DEBUG=false to ship. Everything it changes reads through cfg, so nothing else branches. */
let DEBUG = true;
const cfg = {
  world:{ cellW:4000, cellH:4000, gridW:20, gridH:20, edgeHyst:40, transCd:0.3, fadeT:0.35, memoryT:60, fovDiag:1500, asteroidShard:4, asteroidCrate:0.05,
          stormGraceMin:1.2, stormGraceMax:5.0,   // storm barrage is suppressed this long on entry; longer the more hurt you are
          startCx:10, startCy:10, ringStep:0.10,   // 20x20; START at centre (edge ~ring 10); LARGE-map regime, so megas are the seeded roll
          megaBigThreshold:10, megaBigMinRing:4, megaBigChance:9 },   // >10 in either dim => megas are a 1-in-9 per-cell roll for cells > ring 4 from spawn; <=10 => perimeter lairs
  station:{ hubR:26, ringR:52, dockR:110, rateOpen:0.55, rateDense:0.30,
            distressRate:0.22, distressHp:260, distressRaiders:7, distressDps:5.5, distressReward:2 },   // denser than plan (0.35/0.15) — Vadim wants stations closer together
  /* playerPullFrac: the pull the SHIP feels is capped at this fraction of its own top speed, so
     full thrust always nets (1-frac) of its speed outward. 0.6 leaves a 40% margin, which is the
     difference between a costly escape and a death sentence: escaping the 150 u horizon from dead
     centre must take meaningfully LESS than bhDrainTime, or "you can always escape" is a lie. */
  gravity:{ bhDrainTime:2.5, bhExcessFactor:3.0, playerPullFrac:0.60, playerPullPerThruster:0.05, playerPullFloor:0.30 },   // horizon empties any hull up to the MEDIAN achievable hull in a flat bhDrainTime s; hull above the median bleeds at 1/bhExcessFactor. Plateau is derived from the hull upgrade registries (hullEnvelope), so retuning hull tracks automatically. Regen extends survival.
  /* z-depth for gravitating bodies, as a fraction of CAM_H (600). This floor is load-bearing:
     gravityAt uses r = sqrt(rho^2 + z^2), so z is a HARD FLOOR on r however close you get in-plane.
     The old floor of 0.15 (= 90 u) sat ABOVE the black hole's 60 u kill radius, which meant
     insideKill could never fire for any black hole in the game — they were all decorative.
     A lethal body's z floor must be below its smallest lethal radius. */
  /* bhole z is now VISUAL ONLY (gravity is in-plane), but keep the range tight so the drawn disc
     stays a believable size relative to its fixed 150 u horizon. */
  zDepth:{ bhole:[0.025,0.30], star:[0.05,3.5], planet:[0.15,3.5] },
  phen:{ maxMajors:3, clusters:[1,2], debugMul:2.6, debugMajors:5,           // debug* apply only when DEBUG is on
    rolls:[["planet",0.45],["galaxy",0.30],["comet",0.30],["star",0.22],["pulsar",0.18],["remnant",0.18],["bhole",0.14],["worm",0.12],["wall",0.12]] },
  player:{
    radius:13, speed:236, accel:13,
    maxHP:25, regen:0, iframes:0.35, magnet:750,
    critChance:0, critMult:2,
    mDamage:1, mCooldown:1, mArea:1, mAmount:0, mProjSpeed:1,    // global weapon modifiers
    shieldMax:3.0, shieldDrain:1.0, shieldRecharge:0.55, shieldDelay:0.8, shieldShove:235,
    /* ram: dmg = (speed - minSpeed) * k * (shielded ? shieldMul : 1) * mDamage, per-target cd */
    /* Tuned so a MAXED, SHIELDED charge kills roughly one amoeba cell per impact — you bore a
       tunnel through the body rather than deleting the colony. Unshielded, or on a slower hull,
       you bounce. k=7 destroyed 157 of 164 cells in ten seconds, which was not "a good way in". */
    ram:{ minSpeed:120, k:3.5, shieldMul:2.0, cd:0.30 },
    /* SURVIVOR core: smaller, faster, half the hull; launched toward the safest sampled point.
       `trigger` fires the split at a FRACTION OF MAX HULL rather than on the killing blow, so the
       ship is abandoned while it can still be flown out — the eject is an escape, not a death
       rattle. The hp<=0 path stays as a backstop for one-shot damage that skips the window. */
    /* autosave cadence; the run is also written on cell change, dock, hull swap and on exit */
    autoSaveEvery:45,

const MEGA_DEFS=[

   - LARGE map (either dim > threshold): the perimeter can't hold enough and the map is mostly
     interior, so megas are a SEEDED PER-CELL ROLL — 1-in-megaBigChance for any cell farther than
     megaBigMinRing (Chebyshev) from spawn. No list; lairAt() computes it on demand, deterministically.
   Either way lairAt() is the single source of truth every consumer already goes through. */
function mapIsBig(){ return cfg.world.gridW>cfg.world.megaBigThreshold || cfg.world.gridH>cfg.world.megaBigThreshold; }
function buildLairs(){
  MEGA_LAIRS={};
  if(mapIsBig())return;                    /* large maps don't enumerate — lairAt rolls per cell */
  const W=cfg.world.gridW, H=cfg.world.gridH, n=MEGA_DEFS.length;
  const per=2*(W-1)+2*(H-1);
  const perimPt=(t)=>{                      /* t in [0,per) -> a cell on the border */
    t=((t%per)+per)%per;
    if(t<W-1)            return {cx:Math.round(t), cy:0};
    t-=(W-1);
    if(t<H-1)            return {cx:W-1, cy:Math.round(t)};
    t-=(H-1);
    if(t<W-1)            return {cx:W-1-Math.round(t), cy:H-1};
    t-=(W-1);
    return {cx:0, cy:H-1-Math.round(t)};
  };
  const used=new Set();
  for(let i=0;i<n;i++){
    let p=perimPt(i*per/n), guard=0;
    while(used.has(p.cx+","+p.cy) && guard++<per){ p=perimPt(i*per/n+guard); }
    used.add(p.cx+","+p.cy);
    const def=MEGA_DEFS[i];
    MEGA_LAIRS["lair"+i]={cx:p.cx, cy:p.cy, kind:def.kind, variant:def.variant};

  if(cx===cfg.world.startCx&&cy===cfg.world.startCy)return null;
  if(ringDist(cx,cy)<=cfg.world.megaBigMinRing)return null;     /* safe zone near spawn */
  const rng=mulberry32((cellSeed(cx,cy)^0x3E6A5D17)>>>0);
  if(rng()>=1/cfg.world.megaBigChance)return null;              /* 1-in-N cells */
  const def=MEGA_DEFS[Math.floor(rng()*MEGA_DEFS.length)%MEGA_DEFS.length];
  return {cx, cy, kind:def.kind, variant:def.variant};

     and damage-check the SAME polylines. Once the warning fires there is no retargeting — the path

  lockT:0.40, lockTurn:7.0, warnT:0.80, strikeT:0.28,

  segRepelR:52, segRepelK:520, segRepelIters:3,
  /* LASER (plan §5b.1, the OTHER locked attack): a fast-tracking warning RAY that locks and becomes

  laserChance:0.4, laserWarnT:0.7, laserFireT:1.1, laserLen:1200, laserW:16, laserDmg:16, laserTrack:2.2,

  panicGrace:3.0, panicSpeed:0.97,

/* S4 DEVOUR (plan §5b.1, locked): the head hunts trash and asteroids, eats them whole, and grows a
   new tail segment. Eaten things drop NOTHING — clearing a cell before it does is a real tactic. */
function serpentFood(M){
  const S=SERPENT, H=M.head; let best=null, bd=S.huntR*S.huntR;
  for(const e of enemies){ if(e.dead||e.mega||(e.type&&e.type.boss))continue;
    const dx=e.x-H.x, dy=e.y-H.y, d2=dx*dx+dy*dy; if(d2<bd){ bd=d2; best=e; } }
  for(const a of asteroids){ if(a.dead)continue;
    const dx=a.x-H.x, dy=a.y-H.y, d2=dx*dx+dy*dy; if(d2<bd){ bd=d2; best=a; } }
  return best;
}
function serpentGrow(M){
  const S=SERPENT, live=M.segs.filter(s=>!s.dead);
  if(live.length>=S.maxSegs)return false;
  const tail=live.length?live[live.length-1]:M.head;
  const idx=M.segs.length, hp=S.segHp*D.hp*MEGA_HP_MUL;
  M.segs.push({ id:uid++, mega:true, serpent_seg:true, chainIdx:idx, chainLength:idx+1,
    x:tail.x, y:tail.y, r:Math.max(13,24-idx*0.5), hp, maxHp:hp,
    dead:false, flash:0, warded:0, stasisT:0,
    type:{ name:"Serpent Body", color:"#68d0e8", dmg:8, boss:false, mega:true, r:22, speed:0, sides:0 } });
  enemies.push(M.segs[M.segs.length-1]); bossesAlive++;
  M.segCount=M.segs.length;
  addEffect({type:"ring",x:tail.x,y:tail.y,maxR:46,life:0.3,max:0.3,color:"#8be9ff"});
  return true;
}
/* Multi-path, multi-fork lightning tree. Built once, in world space, and never touched again. */
function makeLightningTree(x0,y0,ang,len,spread,nBolts){
  const paths=[];
  const build=(x,y,a,L,depth)=>{
    const pts=[{x,y}], steps=Math.max(3,Math.round(L/54));
    let cx=x, cy=y, ca=a;
    for(let i=0;i<steps;i++){
      ca+=rand(-0.34,0.34);
      const seg=L/steps;
      cx+=Math.cos(ca)*seg; cy+=Math.sin(ca)*seg;
      pts.push({x:cx,y:cy});
      if(depth<2 && Math.random()<0.28)
        build(cx,cy, ca+(Math.random()<0.5?-1:1)*rand(0.40,1.00), L*rand(0.30,0.55), depth+1);
    }
    paths.push(pts);
  };
  for(let i=0;i<nBolts;i++)
    build(x0,y0, ang+(nBolts>1?(i/(nBolts-1)-0.5)*spread:0), len, 0);
  return paths;
}
function serpentAttack(M,dt,atkMul,panicking){
  const S=SERPENT, H=M.head, A=M.atk;
  if(A.phase==="none"){
    M.headAtkCd-=dt;
    if(panicking)return;                               /* a fleeing snake does not stop to shoot */
    if(M.headAtkCd<=0 && Math.hypot(P.x-H.x,P.y-H.y)<S.boltLen*0.85){
      /* pick the committed cone or the tracking laser */
      if(Math.random()<S.laserChance){ A.phase="laserWarn"; A.t=S.laserWarnT; A.ang=M.headHeading; }
      else { A.phase="lock"; A.t=S.lockT; }
    }
    return;
  }
  A.t-=dt;
  if(A.phase==="lock"){
    const want=Math.atan2(P.y-H.y,P.x-H.x);
    let dh=want-M.headHeading; while(dh>Math.PI)dh-=TAU; while(dh<-Math.PI)dh+=TAU;
    M.headHeading+=clamp(dh,-S.lockTurn*dt,S.lockTurn*dt);   /* turns nimbly, but does not move */
    if(A.t<=0){
      A.phase="warn"; A.t=S.warnT; A.hit=false; A.ang=M.headHeading;
      A.paths=makeLightningTree(H.x,H.y,A.ang,S.boltLen,S.boltSpread,S.boltCount);
    }
    return;
  }
  /* LASER: warn RAY tracks the player fast, then a sustained beam that KEEPS tracking (slower),
     dealing continuous damage while you're on the line. Break line-of-sight or eat it. */
  if(A.phase==="laserWarn"){
    const want=Math.atan2(P.y-H.y,P.x-H.x);
    let dh=want-A.ang; while(dh>Math.PI)dh-=TAU; while(dh<-Math.PI)dh+=TAU;
    A.ang+=clamp(dh,-S.lockTurn*1.3*dt,S.lockTurn*1.3*dt);
    if(A.t<=0){ A.phase="laserFire"; A.t=S.laserFireT; }
    return;
  }
  if(A.phase==="laserFire"){
    const want=Math.atan2(P.y-H.y,P.x-H.x);
    let dh=want-A.ang; while(dh>Math.PI)dh-=TAU; while(dh<-Math.PI)dh+=TAU;
    A.ang+=clamp(dh,-S.laserTrack*dt,S.laserTrack*dt);   /* beam still tracks, but slower */
    const ex=H.x+Math.cos(A.ang)*S.laserLen, ey=H.y+Math.sin(A.ang)*S.laserLen;
    const hit=segPointDist(P.x,P.y,H.x,H.y,ex,ey);
    if(hit.d<S.laserW*0.5+P.radius) hurtPlayer(S.laserDmg*D.dmg*dt);   /* per-second; i-frames gate */
    if(A.t<=0){ A.phase="none"; M.headAtkCd=S.attackCd/atkMul; }
    return;
  }
  if(A.phase==="warn"){ if(A.t<=0){ A.phase="strike"; A.t=S.strikeT; } return; }
  if(A.phase==="strike"){
    if(!A.hit && A.paths){
      for(const path of A.paths){
        for(let i=0;i+1<path.length;i++){
          const hit=segPointDist(P.x,P.y,path[i].x,path[i].y,path[i+1].x,path[i+1].y);
          if(hit.d<S.boltHitR+P.radius){ hurtPlayer(S.boltDmg*D.dmg); A.hit=true; break; }
        }
        if(A.hit)break;
      }
    }
    if(A.t<=0){ A.phase="none"; A.paths=null; M.headAtkCd=S.attackCd/atkMul; }
  }
}
function updateSerpent(dt){
  const M=mega, H=M.head, S=SERPENT; if(H.dead)return;
  const liveN=M.segs.filter(s=>!s.dead).length;
  const deadFrac = (M.segCount - M.aliveCount) / Math.max(1,M.segCount);
  const frenzy   = M.aliveCount===0;                    /* tailless head: it stops being careful */
  const atkMul   = (1 + S.atkEscalation*deadFrac) / (frenzy ? S.frenzyAtk : 1);

  /* PANIC: a gravity tear starts it, and so does crossing an event horizon — a snake that dives
     straight down a well never stretches (gravity drags the whole chain together), so it would
     never tear, never panic, and simply die. Once panicking, only clear air lets the timer run. */
  {
    const Gh=gravityAt(H.x,H.y);
    if(Gh.insideReh){ const w=nearestWell(H.x,H.y); if(w){ M.panicT=S.panicGrace; M.panicW=w; } }
  }
  if(M.panicT>0){
    const w=nearestWell(H.x,H.y);
    if(w){ M.panicW=w; M.panicT=Math.max(M.panicT,S.panicGrace*0.5); }   /* not out yet */
    else M.panicT-=dt;
  }
  const panicking = M.panicT>0 && M.panicW;

  serpentAttack(M, dt, atkMul, panicking);
  const frozen = M.atk.phase!=="none";   /* head is locked in place for the entire attack sequence */

  /* head steering: flee a well if panicking, else hunt food while short, else come for the player.
     A FRENZIED (tailless) head does NOT eat — otherwise one asteroid regrows a segment and makes
     it invulnerable again, and bursting the neck would stop being the kill. */
  const food = (!frozen && !panicking && !frenzy && liveN<S.maxSegs) ? serpentFood(M) : null;
  let tx=P.x, ty=P.y;
  if(panicking){ const dx=H.x-M.panicW.x, dy=H.y-M.panicW.y, d=Math.hypot(dx,dy)||1;
    tx=H.x+dx/d*900; ty=H.y+dy/d*900; }
  else if(food){ const fd=Math.hypot(food.x-H.x,food.y-H.y), pd=Math.hypot(P.x-H.x,P.y-H.y);
    if(fd<pd){ tx=food.x; ty=food.y; } }
  const dx=tx-H.x, dy=ty-H.y;
  const targetHeading=Math.atan2(dy,dx);
  let dh=targetHeading-M.headHeading; while(dh>Math.PI)dh-=TAU; while(dh<-Math.PI)dh+=TAU;
  let speedMul = S.speedFull + (S.speedBare - S.speedFull) * deadFrac;   /* always < 1.0 */
  if(panicking) speedMul = Math.max(speedMul, S.panicSpeed);
  const speed = P.speed * speedMul;
  const turn = 3.5 * (frenzy ? S.frenzyTurn : 1);
  if(!frozen){
    M.headHeading += Math.max(-turn*dt, Math.min(turn*dt, dh));
    H.x += Math.cos(M.headHeading)*speed*dt; H.y += Math.sin(M.headHeading)*speed*dt;
    H.x=clamp(H.x,50,worldW-50); H.y=clamp(H.y,50,worldH-50);
  }

  /* chomp anything inside the jaws */
  M.devourCd=(M.devourCd||0)-dt;
  if(!frozen && !panicking && !frenzy && M.devourCd<=0 && liveN<S.maxSegs){
    let ate=null;
    for(const e of enemies){ if(e.dead||e.mega||(e.type&&e.type.boss))continue;
      const ex=e.x-H.x, ey=e.y-H.y, rr=S.chompR+(e.r||14);
      if(ex*ex+ey*ey<rr*rr){ ate=e; break; } }
    if(!ate) for(const a of asteroids){ if(a.dead)continue;
      const ax=a.x-H.x, ay=a.y-H.y, rr=S.chompR+a.r;
      if(ax*ax+ay*ay<rr*rr){ ate=a; break; } }
    if(ate){ ate.dead=true;                       /* eaten whole: no shards, no cores, no kill credit */
      burst(H.x,H.y,"#8be9ff",18,3.6);
      serpentGrow(M); M.devourCd=S.devourCd; }
  }

  /* VELOCITY-CAPPED FOLLOW + GRAVITY TEARING (plan §5b.1). The old follow snapped each segment to
     spacing every single frame, so the chain physically could not be stretched — and therefore
     could never tear. Now a segment closes its gap at a bounded speed and gravity pulls on it, so
     a deep well can hold the tail back while the head drives away. Past tearDist the link parts and
     everything behind it goes with it. Drag a serpent across a black hole and you rip its tail off. */
  const maxStep=P.speed*S.followV*dt;
  const liveSegs=M.segs.filter(s=>!s.dead);
  let prev=H, tearAt=null, li=0;
  for(const s of liveSegs){
    s.chainIdx=li++; s.chainLength=liveSegs.length;   /* re-index so the new tail tip is the softest */
    const G=gravityAt(s.x,s.y); s.x+=G.vx*dt; s.y+=G.vy*dt;
    const sx=prev.x-s.x, sy=prev.y-s.y, sd=Math.hypot(sx,sy)||1;
    if(sd>S.tearDist && !tearAt) tearAt=s;
    if(sd>S.segSpacing){ const move=Math.min(sd-S.segSpacing, maxStep);
      s.x+=sx/sd*move; s.y+=sy/sd*move; }
    const px=-sy/sd, py=sx/sd, ph=totalTime*1.6+s.chainIdx*0.5;
    s.x+=px*Math.sin(ph)*22*dt; s.y+=py*Math.sin(ph)*22*dt;
    prev=s;
  }
  /* SEGMENT REPULSION — push non-adjacent pairs apart so the coil has volume and cannot self-
     intersect. Iterated (Gauss-Seidel style), because a single pass loses to the chain follow that
     re-snaps spacing every frame. Positional, clamped, n<=34 so O(iters*n^2) is fine. */
  const rr=S.segRepelR, rr2=rr*rr;
  for(let it=0;it<S.segRepelIters;it++){
    for(let i=0;i<liveSegs.length;i++){ const a=liveSegs[i];
      for(let j=i+2;j<liveSegs.length;j++){ const b=liveSegs[j];   /* i+2: skip the chain neighbour */
        const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
        if(d2>=rr2||d2<1e-4)continue;
        const d=Math.sqrt(d2)||1, push=(rr-d)*0.5;   /* move each half the overlap, directly */
        const nx=dx/d, ny=dy/d;
        a.x-=nx*push; a.y-=ny*push; b.x+=nx*push; b.y+=ny*push;
      }
    }
  }
  for(const s of liveSegs){ s.x=clamp(s.x,50,worldW-50); s.y=clamp(s.y,50,worldH-50); }
  if(tearAt){ addEffect({type:"ring",x:tearAt.x,y:tearAt.y,maxR:80,life:0.45,max:0.45,color:"#ff96dc"});
    const w=nearestWell(tearAt.x,tearAt.y);
    if(w){ M.panicT=S.panicGrace; M.panicW=w; M.atk.phase="none"; M.atk.paths=null; }
    /* the severed tail spirals into the well rather than blinking out */
    for(let qi=tearAt.chainIdx; qi<liveSegs.length; qi++){ const seg=liveSegs[qi]; if(seg&&!seg.dead)spawnSinkDebris(seg.x,seg.y,seg.r||18,"#8be9ff"); }
    killEnemy(tearAt); }                            /* routes to killSerpentSeg -> tail cascade */

  M.aliveCount = M.segs.filter(s=>!s.dead).length;
  H.invulnerable = M.aliveCount>0;
}

/* ---- SUMMONER: clones ------------------------------------------------------------------------
   A clone is a stripped copy of the ship: it flies in formation, fires the player's main weapon at
   its own damage scale, taunts every enemy, and does NOT shield. Quality is a weighted gamble, so
   the ability is a slot machine rather than a flat cooldown. */
let clones=[];
const SUMMON={
  /* weighted quality table — must sum to 1 */
  table:[ {p:0.60, mul:0.25, n:1, nm:"shade"},
          {p:0.20, mul:0.50, n:1, nm:"echo"},
          {p:0.10, mul:1.00, n:1, nm:"twin"},
          {p:0.05, mul:2.00, n:1, nm:"paragon"},
          {p:0.05, mul:1.00, n:2, nm:"pair"} ],
  lifeBase:2.2, lifePerHullUp:0.28, lifeCapFrac:0.30,   /* cap: 30% of the recharge, per spec */
  followR:96, follow:5.0, fireMul:1.0
};
function summonLife(){
  /* Hull upgrades extend the clone's life, but never past lifeCapFrac of the recharge time. */
  const ups=(typeof curUps==="function"?(curUps().hp||0):0);
  return Math.min(SUMMON.lifeBase+ups*SUMMON.lifePerHullUp, P.pSummonCd*SUMMON.lifeCapFrac);
}
function rollSummon(){
  let r=Math.random(), acc=0;
  for(const t of SUMMON.table){ acc+=t.p; if(r<acc)return t; }
  return SUMMON.table[0];
}
function spawnClones(){
  const t=rollSummon(), life=summonLife();
  for(let i=0;i<t.n;i++){
    const ang=TAU*(i+0.5)/t.n;
    clones.push({ isClone:true, dead:false, x:P.x+Math.cos(ang)*SUMMON.followR, y:P.y+Math.sin(ang)*SUMMON.followR,
      vx:0, vy:0, slot:ang, r:P.radius, life, max:life,
      hp:P.maxHP*t.mul, maxHp:P.maxHP*t.mul, dmgMul:t.mul, speed:P.speed, wcd:0, flash:0 });
  }
  toast("ECHO \u00B7 "+t.nm+(t.n>1?" x"+t.n:"")+" ("+Math.round(t.mul*100)+"%)");
  addEffect({type:"ring",x:P.x,y:P.y,maxR:120,life:0.35,max:0.35,color:"#b0f0ff"});
}
/* Shared damage entry for taunting decoys (clones and the survivor shell). */
function hurtDecoy(d,dmg){
  if(!d||d.dead)return;
  d.hp-=dmg; d.flash=0.1;
  if(d.hp<=0){ d.dead=true; burst(d.x,d.y,d.isShell?"#ffb86b":"#b0f0ff",14,3.5);
    addEffect({type:"ring",x:d.x,y:d.y,maxR:70,life:0.35,max:0.35,color:d.isShell?"#ffb86b":"#b0f0ff"});
    if(d.isShell)P.shellDecoy=null; }
}
function updateClones(dt){
  if(P.pSummon){
    P.summonCd=(P.summonCd||0)-dt;
    if(P.summonCd<=0 && clones.filter(c=>!c.dead).length===0){ P.summonCd=P.pSummonCd; spawnClones(); }
  }
  for(let i=clones.length-1;i>=0;i--){ const c=clones[i];
    if(c.flash>0)c.flash-=dt;
    c.life-=dt;
    if(c.life<=0||c.dead){ if(!c.dead)burst(c.x,c.y,"#b0f0ff",10,2.5); clones.splice(i,1); continue; }
    /* fly in formation beside the ship */
    const tx=P.x+Math.cos(c.slot+totalTime*0.6)*SUMMON.followR, ty=P.y+Math.sin(c.slot+totalTime*0.6)*SUMMON.followR;
    c.vx+=(tx-c.x)*SUMMON.follow*dt; c.vy+=(ty-c.y)*SUMMON.follow*dt;
    c.vx*=0.88; c.vy*=0.88; c.x+=c.vx*dt*10; c.y+=c.vy*dt*10;
    if(!Number.isFinite(c.x)){c.x=P.x;c.y=P.y;c.vx=0;c.vy=0;}
    /* fire the player's main weapon at its own scale */
    c.wcd-=dt;
    if(c.wcd<=0){ const id=P.slots.main, def=id&&WEAPONS[id];
      if(def){ const s=def.stats(P.weaponLevels[id]||1);
        c.wcd=s.cooldown*P.mCooldown;
        const sx=P.x,sy=P.y,sd=P.mDamage;
        P.x=c.x; P.y=c.y; P.mDamage=sd*c.dmgMul*SUMMON.fireMul;   /* fire FROM the clone */
        try{ def.fire(P,s); }catch(err){}
        P.x=sx; P.y=sy; P.mDamage=sd;
      } }
  }
}
/* HYDRA tail. The health bar is EXTERNAL and spatial: a chain of low-HP segments that follows the
   ship (serpent velocity-capped follow) and takes the hits meant for the hull. Count scales with
   max HP from ANY source, so Hull upgrades pay double on this hull. Serpent rules for death: a
   segment dying TRUNCATES the chain behind it. Regrowth is kills-only — the Hydra feeds on battle. */
const HYDRA={
  base:3, perTenth:1, cap:14,          /* 3 segments + 1 per +10% max HP over the hull's bare base
                                          (both meta Hangar HP and in-run Hull shards count) */
  segHp:10, spacing:26, r:9, maxStep:520,
  drawR:180,                            /* enemy PROJECTILES within this of a segment steer into it */
  drawK:7.5,                            /* how hard they steer (rad/s toward the segment) */
  touchCd:0.35,                         /* per-enemy cooldown for chewing on a segment */
  healR:250, healPerKill:4, regrowAt:0.40
};
/* Reference base for the count rule: the hull's bare base, WITHOUT meta. Including metaStartHP()
   made Hangar upgrades raise the numerator and denominator together, so global HP bought no
   segments at all — exactly the thing the hull is supposed to reward. */
function hydraBaseHP(){ return cfg.player.maxHP*0.8; }
function hydraWantCount(){
  if(!P.pTail)return 0;
  const ratio=P.maxHP/Math.max(1,hydraBaseHP());
  return clamp(HYDRA.base+Math.floor((ratio-1)*10*HYDRA.perTenth), HYDRA.base, HYDRA.cap);
}
/* Rebuild the tail to the wanted length, preserving existing segments' damage. */
function hydraSync(fullHeal){
  if(!P.pTail){ P.tail=[]; return; }
  P.tail=P.tail||[];
  const want=hydraWantCount();
  while(P.tail.length<want){
    const prev=P.tail.length?P.tail[P.tail.length-1]:P;
    P.tail.push({x:prev.x,y:prev.y,hp:HYDRA.segHp,maxHp:HYDRA.segHp,dead:false,flash:0});
  }
  if(P.tail.length>want)P.tail.length=want;
  if(fullHeal)for(const s of P.tail){ s.hp=s.maxHp; s.dead=false; }
}
function hydraLive(){ const out=[]; if(!P.tail)return out;
  for(const s of P.tail){ if(s.dead)break; out.push(s); }   /* truncation: stop at the first gap */
  return out; }
/* Where should a chasing enemy actually go? The nearest living segment, else the ship. Nearest (not
   the tip) because tip-targeting would let you kite the whole field into a single trailing point. */
/* Every decoy in the game funnels through here: hydra tail segments, summoner clones and the
   survivor's shell. A TAUNT decoy (clone/shell) outranks a passive one (tail), because those two
   abilities are explicitly "everything attacks this instead of me". */
function decoyList(){
  const out=[];
  if(P.pTail)for(const s of hydraLive())out.push({o:s,taunt:false});
  if(clones)for(const c of clones)if(!c.dead)out.push({o:c,taunt:true});
  if(P.shellDecoy&&!P.shellDecoy.dead)out.push({o:P.shellDecoy,taunt:true});
  return out;
}
function seekTarget(e){
  const list=decoyList(); if(!list.length)return P;
  const taunts=list.filter(d=>d.taunt);
  const pool=taunts.length?taunts:list;
  let best=P, bd=Infinity;
  for(const d of pool){ const dd=(d.o.x-e.x)**2+(d.o.y-e.y)**2; if(dd<bd){ bd=dd; best=d.o; } }
  return best;
}
/* the chase indirection is only consulted when SOMETHING can be taunted */
function hasDecoy(){ return decoyList().length>0; }
function shipById(id){ return SHIPS.find(s=>s.id===id)||SHIPS[0]; }
/* Ships are reachable once you hold a Blueprint, or while docked at a Bastion-captured station. */
/* BLUEPRINTS. A blueprint is PERMISSION to build a hull; special tokens remain the PRICE. Each one
   is dropped by the thing the hull is salvaged from (see each ship's `req`), so a megaboss is a
   specific unlock you can hunt rather than a generic +1. A duplicate is never dead value — it
   converts into tokens. */
function hasBlueprint(id){
  if(DEBUG)return true;
  if(id==="lancer")return true;                 /* always owned */
  return !!(P.blueprints&&P.blueprints[id]);
}
function grantBlueprint(id,quiet){
  if(!id)return;
  P.blueprints=P.blueprints||{};
  const S=shipById(id);
  if(P.blueprints[id]){                          /* duplicate -> tokens, per the design */
    P.specialTokens=(P.specialTokens||0)+1;
    if(!quiet)toast("Duplicate blueprint \u2014 Special Token +1");
    return;
  }
  P.blueprints[id]=true;
  P.shipBlueprints=(P.shipBlueprints||0)+1;      /* count kept for the HUD/save */
  if(!quiet)toast("BLUEPRINT \u00B7 "+S.name);
}
/* Hand out every blueprint whose `req.src` matches. One call site per event. */
function grantBlueprintsFor(src){
  for(const s of SHIPS) if(s.req&&s.req.src===src) grantBlueprint(s.id);
}
function shipsUnlocked(){
  if(DEBUG)return true;                       /* debug: shipyard open from the first dock */
  if((P.shipBlueprints||0)>0)return true;     /* any blueprint at all opens the yard */
  return !!(cellStation && capturedStations.has(cellStation.cx+","+cellStation.cy));
}
/* Hull stats are REBUILT from first principles on every swap rather than multiplied incrementally:
       base (cfg.player)  ->  global meta bonuses (Hangar)  ->  hull multipliers  ->  THAT HULL'S
       own in-run shard upgrades.
   Three consequences Vadim asked for fall out of this directly:
     - global Hangar multipliers apply to every hull, because they are re-applied each rebuild;
     - in-run shard upgrades STAY WITH THE HULL THAT BOUGHT THEM (they live in P.hullUpgrades[id]),
       so a swapped-out ship keeps its build and is exactly as you left it when you return;
     - nothing compounds, because we never multiply an already-multiplied value. */
function hullUps(id){ P.hullUpgrades=P.hullUpgrades||{}; P.hullUpgrades[id]=P.hullUpgrades[id]||{}; return P.hullUpgrades[id]; }
/* Every ability flag, zeroed. One list, used by rebuildHull AND by loadRun's perk restore, so a
   new perk added in one place cannot silently linger from a previous hull in the other. Transient
   ability state (charge, timers) resets here too. */
function clearPerks(){
  P.pReflect=0; P.pReflectDmg=0; P.pFrenzyDmg=0; P.pFrenzySpd=0; P.pRam=0; P.pNoKnock=0;
  P.pDigest=0; P.pDigestR=0; P.pMagnet=1; P.pWake=0; P.pWakeR=0; P.pWakeLife=0; P.pMineLife=1;
  P.pSwarm=0; P.pSwarmDur=0; P.pSwarmCd=9; P.pSwarmSegs=0; P.pSwarmR=0;
  P.pSwarmZap=0; P.pSwarmZapR=0; P.pSwarmTick=0.12; P.pPhase=0;
  P.pBlink=0; P.pBlinkR=0; P.pBlinkInv=0; P.pBlinkCd=1.4;
  P.swarmT=0; P.swarmCharge=1; P.swarmZapT=0; P.swarmSpin=0; P.blinkCd=0;
  P.pTail=0; P.tail=[];
  P.pSummon=0; P.pSummonCd=14; P.summonCd=0;
  P.pWarp=0; P.pWarpCd=16; P.pWarpDur=0; P.pWarpScale=1; P.warpT=0; P.warpCd=0; P.warpMul=1;
  P.pSurvive=0; P.survivorUsed=false; P.shellDecoy=null;   /* NB: P.ejected is RUN state, not a

  clones=[];
}
/* loadRun restores raw stats (which already include the hull), so it must NOT rebuild — but the
   perk FLAGS aren't stats and were being lost on load (a loaded Kraken had no wake). This sets
   flags only, touching nothing numeric that the save already contains. */
function applyPerksOnly(id){
  const S=shipById(id); clearPerks();
  for(const k in (S.perks||{})) P[k]=S.perks[k];
  P.mineLifeMul=P.pMineLife||1;
}
function curUps(){ return hullUps(P.hullId||"lancer"); }
function rebuildHull(id, fullHeal){
  const c=cfg.player, S=shipById(id), m=S.mul;
  const hpFrac = (!fullHeal && P.maxHP>0) ? clamp(P.hp/P.maxHP,0,1) : 1;

  /* 1. base x meta x hull */
  P.maxHP        = (c.maxHP+metaStartHP()) * m.maxHP;
  P.speed        = c.speed        * m.speed;
  P.accel        = c.accel;
  P.regen        = c.regen        * m.regen;
  P.shieldMax    = c.shieldMax    * m.shieldMax;
  P.radius       = c.radius       * m.radius;
  P.critChance   = c.critChance   * m.critChance;
  P.critMult     = c.critMult;
  P.magnet       = c.magnet;
  P.iframes      = c.iframes;
  P.mDamage      = c.mDamage * metaStartDmgMul();
  P.mCooldown    = c.mCooldown;  P.mArea=c.mArea;  P.mAmount=c.mAmount;  P.mProjSpeed=c.mProjSpeed;
  P.shieldDrain  = c.shieldDrain; P.shieldRecharge=c.shieldRecharge;
  P.shieldDelay  = c.shieldDelay; P.shieldShove=c.shieldShove;
  /* clear EVERY perk flag first, then apply this hull's — otherwise a swapped-from hull's ability
     would linger on the new one. */
  clearPerks();
  for(const k in (S.perks||{})) P[k]=S.perks[k];      /* hull-specific ability flags/values */
  P.mineLifeMul = P.pMineLife||1;
  P.magnet *= (P.pMagnet||1);

  /* 2. this hull's own shard upgrades, replayed from zero */
  const ups=hullUps(id);
  for(const u of STAT_UPGRADES){ const n=ups[u.id]||0; for(let i=0;i<n;i++)u.fn(P); }

  P.hullId=id;
  P.maxHP=Math.max(1,P.maxHP);
  if(P.ejected){
    /* the surviving core: half the hull, smaller, and FASTER than the ship it came out of */
    const S2=cfg.player.survive;
    P.maxHP=Math.max(6,P.maxHP*S2.hpMul);
    P.speed*=S2.speedMul; P.radius*=S2.radiusMul;
  }
  hydraSync(!!fullHeal);                 /* tail length tracks maxHP, so Hull upgrades pay double */
  P.hp = fullHeal ? P.maxHP : Math.min(P.maxHP, Math.max(1, P.maxHP*hpFrac));
  P.shield=Math.min(P.shield===undefined?P.shieldMax:P.shield, P.shieldMax);
}
/* Swapping at a shipyard always launches you fresh — a bought or re-equipped hull is full health. */
function applyHull(id){ rebuildHull(id, true); }
/* --- Dreadnought (WP18) --- */
/* Rigid line, ~1800u bow->stern, ~260u beam. ONE transform (pos + heading); every part is placed

    {key:"turretL2",off:0.06,  w:95, armor:0.35,hp:220, col:"#c890ff", side:-1},
    {key:"turretR2",off:0.06,  w:95, armor:0.35,hp:220, col:"#c890ff", side:1},
    {key:"hangar", off:0.22,  w:120, armor:0.4, hp:260, col:"#a0b0c8"},
    {key:"engine", off:0.38,  w:120, armor:1.0, hp:340, col:"#ff9a5a"},   /* THE soft point */
    {key:"bridge", off:0.48,  w:90,  armor:0.8, hp:420, col:"#ffe08a"}    /* win; invuln until engine dies */
  ],
  lanceWarnT:1.0, lanceFireT:1.4, lanceLen:1500, lanceW:26, lanceDmg:16, lanceCd:6,

  hangarCd:11, hangarSize:3, hangarCap:9, hangarType:"charger",
  ramDmg:38, shearFrac:0.5,   /* fraction of a part's max HP sheared per second inside a horizon */

function spawnDreadnought(){

     it will cruise toward the player under its own (slow) power. */
  const cx=worldW*0.82, cy=worldH*0.82;
  const mg={ kind:"dreadnought", cell:{cx:cellCx,cy:cellCy}, defeated:false, parts:[],
    x:cx, y:cy, heading:Math.atan2(worldH/2-cy,worldW/2-cx),
    mode:"cruise", modeT:0, burnCd:DREAD.burnCd, burnVec:{x:0,y:0},
    lance:{phase:"none",t:0}, lanceCd:DREAD.lanceCd, rocketCd:DREAD.rocketCd,
    hangarCd:DREAD.hangarCd, pdCd:DREAD.pdCd, core:null };
  for(const pd of DREAD.parts){
    const hp=pd.hp*D.hp*MEGA_HP_MUL;
    const p={ id:uid++, mega:true, dread:true, key:pd.key, off:pd.off, w:pd.w, side:pd.side||0,

function dreadPlaceParts(M){
  const c=Math.cos(M.heading), s=Math.sin(M.heading), L=DREAD.len, B=DREAD.beam;

    p.x=M.x + ax*c - ay*s;
    p.y=M.y + ax*s + ay*c;
  }

/* --- Squid (WP16) --- */
/* Squid anatomy: the body has a FRONT (a clean half-circle, no limbs) and a BACK, where all eight
   limbs attach across the rear hemisphere. Limbs are twice as long as before (8 x 45 = 360 u, was
   5 x 36 = 180) and every one of them flails at the ship, curling from its rear root toward the
   player with a travelling whip wave. A limb rooted on the far side has to curl most of the way
   round to reach a target in front, so it arrives short — the front is naturally the safer face
   without needing a special rule for it. */
const SQUID={ bodyHp:1400, jointHp:80, limbs:8, jointsPerLimb:8, limbSpacing:45,
  restT:2.4, aimT:1.2, leapT:0.9, coastT:0.6,
  backArc:Math.PI*0.92,   /* limbs spread across the rear half-circle only */
  /* Limb physics is the SERPENT's (plan §5b.3: "locked physics = serpent's"): velocity-capped
     follow, which is what gravity tearing depends on. The old lerp-follow could never be
     outrun, so a well could never rip a limb off. Regrowth happens in REST only — that is what
     makes REST a phase you have to deny rather than a pause you wait out. */
  followV:1.35, tearDist:120, regrowT:1.1,
  /* ESCALATION (plan §5b.3). ENRAGE: fewer limbs -> the leap cycle tightens, so amputating it
     makes it come at you harder. PANIC-LEAP: a gravity-torn limb sends it bounding away from the
     well — it escapes in its own movement vocabulary. INK TRAIL: DoT clouds are laid ALONG the
     leap path, so every dodged leap redraws the arena. AVOIDANCE: it refuses to leap through a
     pull region — the squid RESPECTS gravity where the serpent fears it. */
  enrage:0.62, panicLeapSpeed:1.9,
  inkGap:95, inkR:66, inkLife:3.4, inkDmg:2,
  avoidSamples:8, avoidPull:26, avoidTurn:0.42, avoidTries:6,
  maxBend:2.6,            /* how far a limb can curl toward the player (~150 deg) */
  bendCurve:1.8,          /* curl accelerates along the limb: stiff at the root, whippy at the tip.
                             Linear (1.0) deflects joint 0 by an eighth of the bend, which pushed
                             the outermost roots forward past the halfway line. */
  whipRate:5.2, whipWave:3.4, whipAmp:0.42, limbLerp:0.24 };
function spawnSquid(){

/* Peak pull along a candidate leap path. The squid will not fly into a well. */
function pathPull(x0,y0,vx,vy,T,n){

function updateSquid(dt){
  const M=mega, B=M.body, S=SQUID; if(B.dead)return;

  /* ENRAGE: the cycle tightens as limbs are lost */
  let live=0, tot=0;
  for(const L of M.limbs) for(const j of L){ tot++; if(!j.dead)live++; }
  const loss = 1 - live/Math.max(1,tot);
  const k = 1 - S.enrage*loss;                       /* 1.0 intact -> 0.38 stripped */

  M.stateT -= dt;
  if(M.stateT<=0){
    if(M.state==="REST"){ M.state="AIM"; M.stateT=S.aimT*k; }
    else if(M.state==="AIM"){ M.state="LEAP"; M.stateT=S.leapT;
      const speed=P.speed*1.4;
      let dx=P.x-B.x, dy=P.y-B.y, d=Math.hypot(dx,dy)||1;
      let vx=dx/d*speed, vy=dy/d*speed;
      /* FIELD AVOIDANCE: fan out from the direct line until a path clears the pull regions */
      if(pathPull(B.x,B.y,vx,vy,S.leapT,S.avoidSamples)>S.avoidPull){
        const base=Math.atan2(vy,vx);
        let best=null, bestP=1e9;
        for(let i=1;i<=S.avoidTries;i++){
          for(const sgn of [1,-1]){
            const a=base+sgn*S.avoidTurn*i;
            const p=pathPull(B.x,B.y,Math.cos(a)*speed,Math.sin(a)*speed,S.leapT,S.avoidSamples);
            if(p<bestP){ bestP=p; best=a; }
          }
          if(bestP<=S.avoidPull)break;
        }
        if(best!=null){ vx=Math.cos(best)*speed; vy=Math.sin(best)*speed; M.heading=best; }
      }
      M.leapVec={x:vx,y:vy}; M.inkAcc=0; }
    else if(M.state==="LEAP"){ M.state="COAST"; M.stateT=S.coastT*k; }
    else if(M.state==="COAST"){ M.state="REST"; M.stateT=S.restT*k; M.leapVec={x:0,y:0}; }
  }
  if(M.state==="AIM"){ const dx=P.x-B.x, dy=P.y-B.y; M.heading=Math.atan2(dy,dx); }
  else if(M.state==="LEAP"){ B.x+=M.leapVec.x*dt; B.y+=M.leapVec.y*dt; }
  else if(M.state==="COAST"){ B.x+=M.leapVec.x*dt*0.3; B.y+=M.leapVec.y*dt*0.3; }
  if(!Number.isFinite(B.x))B.x=worldW/2; if(!Number.isFinite(B.y))B.y=worldH/2;   /* never let a leap NaN the body */
  B.x=clamp(B.x,80,worldW-80); B.y=clamp(B.y,80,worldH-80);

  /* INK TRAIL: a cloud every inkGap units of leap travel — the arena is redrawn behind it */
  if(M.state==="LEAP"||M.state==="COAST"){
    const spd=Math.hypot(M.leapVec.x,M.leapVec.y)*(M.state==="COAST"?0.3:1);
    M.inkAcc=(M.inkAcc||0)+spd*dt;
    if(M.inkAcc>=S.inkGap){ M.inkAcc-=S.inkGap;
      hazards.push({kind:"cloud",x:B.x,y:B.y,r:S.inkR,telegraph:0,life:S.inkLife,color:"#8b5aff",dmg:S.inkDmg*D.dmg,dot:true}); }
  }
  /* LIMBS: rooted on the rear hemisphere, all eight flailing at the ship.
     Each limb bends progressively from its rear root toward the player (bend*t, so it CURLS rather
     than hinging at the base), with a travelling sine wave scaled by t so the tip whips hardest.
     The bend is capped at maxBend, which is what makes the front face genuinely awkward to be hit
     from: a far-side limb reaching around the body arrives curled and short, not straight and long. */
  const toP=Math.atan2(P.y-B.y,P.x-B.x);
  for(let L=0;L<M.limbs.length;L++){
    const limb=M.limbs[L];
    const rootAng = M.heading + Math.PI + (L/(S.limbs-1)-0.5)*S.backArc;
    let bend = toP - rootAng; while(bend>Math.PI)bend-=TAU; while(bend<-Math.PI)bend+=TAU;
    bend = clamp(bend, -S.maxBend, S.maxBend);
    let prev={ x:B.x+Math.cos(rootAng)*B.r, y:B.y+Math.sin(rootAng)*B.r };

      const s=limb[j];
      const t=(j+1)/limb.length;
      const whip=Math.sin(totalTime*S.whipRate + L*1.7 + t*S.whipWave)*S.whipAmp*t*t;
      const ang=rootAng + bend*Math.pow(t,S.bendCurve) + whip;
      const tx=prev.x+Math.cos(ang)*S.limbSpacing, ty=prev.y+Math.sin(ang)*S.limbSpacing;
      if(s.dead){ prev={x:tx,y:ty}; continue; }   /* a dead joint still transmits the limb's shape */

      /* gravity acts on the joint — a well can physically hold it back */
      const G=gravityAt(s.x,s.y); s.x+=G.vx*dt; s.y+=G.vy*dt;
      /* velocity-CAPPED follow: the joint closes on its target at a bounded speed, so it CAN be
         outrun. That is the entire precondition for tearing. */
      const ddx=tx-s.x, ddy=ty-s.y, dd=Math.hypot(ddx,ddy)||1;
      const step=Math.min(dd,cap);

      /* a curling limb must not pass through its own body */

      if(bdd<minD){ s.x=B.x+bx/bdd*minD; s.y=B.y+by/bdd*minD; }
      /* stretched past tearDist -> the limb parts here, and everything distal goes with it */
      if(Math.hypot(s.x-prev.x, s.y-prev.y) > S.tearDist && tearJ<0) tearJ=j;
      prev=s;
    }
    if(tearJ>=0){
      addEffect({type:"ring",x:limb[tearJ].x,y:limb[tearJ].y,maxR:60,life:0.4,max:0.4,color:"#ff96dc"});
      for(let qj=tearJ;qj<limb.length;qj++){ const jj=limb[qj]; if(jj&&!jj.dead)spawnSinkDebris(jj.x,jj.y,jj.r||12,"#a06adf"); }
      const w=nearestWell(limb[tearJ].x,limb[tearJ].y);
      if(w){   /* PANIC-LEAP: bound directly away from the field, right now */
        const dx=B.x-w.x, dy=B.y-w.y, d=Math.hypot(dx,dy)||1, sp=P.speed*S.panicLeapSpeed;
        M.state="LEAP"; M.stateT=S.leapT; M.inkAcc=0;
        M.leapVec={x:dx/d*sp, y:dy/d*sp}; M.heading=Math.atan2(dy,dx);
      }
      killEnemy(limb[tearJ]);                    /* routes to killSquidJoint -> distal cascade */
    }
  }

  /* REST-ONLY REGROWTH: one joint per regrowT, root-outward, and only while resting. Sustained
     pressure denies healing (plan §5b.3) — you have to keep it out of REST, not just out-damage it. */
  if(M.state==="REST"){
    M.regrowCd=(M.regrowCd||S.regrowT)-dt;
    if(M.regrowCd<=0){
      M.regrowCd=S.regrowT;
      let best=null, bestJ=1e9;
      for(const limb of M.limbs) for(let j=0;j<limb.length;j++)
        if(limb[j].dead && j<bestJ){ best=limb[j]; bestJ=j; }
      if(best){
        best.dead=false; best.hp=best.maxHp; best.flash=0; best.warded=0; best.stasisT=0;
        enemies.push(best); bossesAlive++;        /* dead entries are filtered from enemies[] each frame */
        burst(best.x,best.y,"#a06adf",8,2.2);
      }
    }
  } else M.regrowCd=S.regrowT;
  /* ink cloud puffs */
  /* resting puffs only — the leap trail is laid above, along the path */
  M.cloudCd-=dt;
  if(M.state==="REST" && M.cloudCd<=0){ M.cloudCd=1.4;
    hazards.push({kind:"cloud",x:B.x+rand(-30,30),y:B.y+rand(-30,30),r:S.inkR*0.8,telegraph:0,life:S.inkLife*0.8,color:"#8b5aff",dmg:S.inkDmg*D.dmg,dot:true}); }
}

   to simulate a 1000-cell soft body. hardwareConcurrency + touch + DPR is a good-enough proxy. */
let _amoebaCap=0;
function amoebaCapForDevice(){
  if(_amoebaCap)return _amoebaCap;

  const touch=(navigator&&navigator.maxTouchPoints)>0;

const hexDist=(q,r)=>(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2;

   interface, i.e. they harden. Wounds clot. */
function amoebaRoles(M){

    let live=0; for(const n of s.nbr) if(!n.dead)live++;

    s.role = s.exposed ? "interface" : "inner";

function amoebaPickNodes(M){

  for(const s of M.all)s.node=false;
  const liveSegs=M.segments.filter(s=>!s.dead).length;
  const budget=Math.max(1,Math.min(A.nodeMax,Math.floor(liveSegs/A.nodesPer)));
  const pool=M.segments.filter(s=>!s.dead&&s.role==="interface"&&M.nodes.indexOf(s)<0);

      hq:q, hr:r, x:est.x, y:est.y, vx:est.vx, vy:est.vy, fx:0, fy:0, mass:1, nbr:[], node:false,

function attachMegaToEnemies(){

  else if(mega.kind==="serpent"){ if(!mega.head.dead){enemies.push(mega.head);count++;} for(const s of mega.segs)if(!s.dead){enemies.push(s);count++;} }
  else if(mega.kind==="squid"){ if(!mega.body.dead){enemies.push(mega.body);count++;} for(const L of mega.limbs)for(const j of L)if(!j.dead){enemies.push(j);count++;} }
  else if(mega.kind==="amoeba"){ if(!mega.core.dead){enemies.push(mega.core);count++;} for(const s of mega.segments)if(!s.dead){enemies.push(s);count++;} }
  else if(mega.kind==="dreadnought"){ for(const p of mega.parts)if(!p.dead){enemies.push(p);count++;} }

function updateBastion(dt){
  for(const ring of mega.rings) ring.angle += ring.omega*dt;
  let aliveParts=0;
  for(const p of mega.parts){
    if(p.dead)continue; aliveParts++;
    const ring=mega.rings[p.ring], slotA=ring.angle + p.slot/ring.n*TAU;
    p.curAng=slotA;
    p.x=mega.hub.x+Math.cos(slotA)*ring.r; p.y=mega.hub.y+Math.sin(slotA)*ring.r;
  }
  mega.core.invulnerable=aliveParts>4;   /* core exposes when only ≤4 outer parts remain */

  /* LIGHTHOUSE: opens at 50% structure lost, then never closes. */
  const M=mega, B=BASTION;
  const structFrac = 1 - aliveParts/Math.max(1,M.parts.length);
  if(!M.lance.on && structFrac>=B.lighthouseAt){
    M.lance.on=true;
    addEffect({type:"ring",x:M.hub.x,y:M.hub.y,maxR:520,life:0.8,max:0.8,color:"#ffaa5a"});
    toast("LIGHTHOUSE");
  }

    M.lance.ang += B.lanceOmega*dt;

    const hit=segPointDist(P.x,P.y,M.hub.x,M.hub.y,ex,ey);
    if(hit.d < B.lanceW*0.5 + P.radius) hurtPlayer(B.lanceDmg*D.dmg);   /* i-frames gate the DoT */
  }

  if(!M.core.invulnerable && !M.core.dead){
    M.pulsarCd-=dt;
    if(M.pulsarCd<=0){ M.pulsarCd=B.pulsarCd;
      const off=Math.random()*TAU;
      for(let i=0;i<B.pulsarN;i++){ const a=off+i/B.pulsarN*TAU;
        ebullets.push({x:M.hub.x,y:M.hub.y,vx:Math.cos(a)*B.pulsarSpeed,vy:Math.sin(a)*B.pulsarSpeed,
                       r:6,life:4.5,dmg:B.pulsarDmg*D.dmg,color:"#ffaa5a"}); }

      ebullets.push({x:p.x,y:p.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:4,life:3,dmg:6*D.dmg,color:"#ff8040"}); } }

  for(const p of mega.parts){ if(p.dead||p.role!=="bay")continue;
    p.cd-=dt*oc; if(p.cd<=0){ p.cd=5.2;
      const tx=P.x+rand(-40,40), ty=P.y+rand(-40,40);
      hazards.push({kind:"blast", x:tx, y:ty, r:70, telegraph:0.9, life:0.9, color:"#c68eff", dmg:14*D.dmg}); } }

  /* ESCORT WAVES: while any bay lives, launch a small fighter screen on a timer. The count of
     living bays scales the wave, and the tally of still-living escorts is capped. */
  const bays=M.parts.filter(p=>!p.dead && p.role==="bay");
  M.escortCd=(M.escortCd||B.escortCd)-dt;

    M.escortCd=B.escortCd;

    const room=Math.max(0, B.escortCap-alive);

/* STRATEGIC MAP LAYER (WP19, plan §5b LOCKED). Every mega has a roam position on the grid. It
   drifts near its lair (~1 cell / 45-90s). Entering its cell aggroes it; once aggroed it PURSUES
   the player across cells at strategic speed, breaking off at Chebyshev distance >= 2, then
   returning to roam. Mega-mega repulsion keeps them >= 1 cell apart. Only the ACTIVE cell simulates
   the fight; this layer just moves the pieces on the map between cells. */
const STRAT={ roamMin:45, roamMax:90, breakoff:2, repel:1 };
function stratInit(st){
  if(st.roamCx!==undefined)return;
  st.roamCx=st.cell.cx; st.roamCy=st.cell.cy;
  st.aggro=false; st.stepCd=rand(STRAT.roamMin,STRAT.roamMax);

function stratStep(st,others){
  /* one strategic move (called when its timer elapses) */
  let tx, ty;
  if(st.aggro){ tx=cellCx; ty=cellCy; }              /* pursue the player */
  else { tx=st.cell.cx; ty=st.cell.cy; }             /* drift home */
  let dx=Math.sign(tx-st.roamCx), dy=Math.sign(ty-st.roamCy);
  if(!st.aggro && dx===0 && dy===0){                 /* idle wander near lair */
    dx=randi(-1,1); dy=randi(-1,1);
  }
  let nx=clamp(st.roamCx+dx,0,cfg.world.gridW-1), ny=clamp(st.roamCy+dy,0,cfg.world.gridH-1);
  /* mega-mega repulsion: don't step within repel distance of another mega */
  for(const o of others){ if(o===st)continue;
    if(Math.max(Math.abs(nx-o.roamCx),Math.abs(ny-o.roamCy))<STRAT.repel){ nx=st.roamCx; ny=st.roamCy; break; } }
  st.roamCx=nx; st.roamCy=ny;

/* Which live mega (if any) has roamed into this cell? Lair megas are excluded — those spawn via

function megaRoamedHere(cx,cy){

     here is by definition a pursuer. (An earlier version also required st.cell!==here, which the
     leave-cell revert had already overwritten — the guard rejected every genuine ambush.) */
  for(const k in megaStates){ const st=megaStates[k];
    if(!st||st.defeated)continue;
    if(st.roamCx===cx&&st.roamCy===cy) return st;
  }

/* Move an ambushing mega's body into this cell's space. Each archetype carries its geometry

  const tx=worldW*(Math.random()<0.5?0.18:0.82), ty=worldH*(Math.random()<0.5?0.18:0.82);
  const anchor = M.core || M.head || M.body || M.hub || {x:worldW/2,y:worldH/2};
  const dx=tx-anchor.x, dy=ty-anchor.y;
  const shift=(o)=>{ if(o&&Number.isFinite(o.x)){ o.x+=dx; o.y+=dy; } };
  shift(M.core); shift(M.head); shift(M.body); shift(M.hub); shift(M.home);
  if(M.parts)for(const p of M.parts)shift(p);
  if(M.segs)for(const s of M.segs)shift(s);
  if(M.segments)for(const s of M.segments)shift(s);
  if(M.all)for(const s of M.all)shift(s);
  if(M.nodes)for(const s of M.nodes)shift(s);
  if(M.limbs)for(const L of M.limbs)for(const j of L)shift(j);
  if(Number.isFinite(M.x)){ M.x+=dx; M.y+=dy; }        /* dreadnought carries its own transform */

/* ELEMENTAL BIOME HAZARDS. Each is indiscriminate by design — it applies to the ship AND to the

const BIOME_FX={

  ice:       { slow:0.55, freezeChance:0.010 },      /* you slow; weak enemies briefly freeze */
  lightning: { every:1.5, dmg:14, edmg:22, r:150, spread:330 },  /* forked bolts near the action, hitting both sides. `r` is legacy (the old blast circle); reach is now BOLT.hitR along the conductors */
  nebula:    { cloak:0.55 },                         /* enemies are harder to see */
  radiation: { dps:2.2,  coreBonus:0.55 }            /* chip damage, richer drops */

let biomeBoltT=0, biomeFlash=0;
/* --- LIGHTNING BIOME: forked bolts with a warning pass on the SAME geometry -------------------

   as a warning, allowed to fade, and then the lethal charge re-renders and damage-checks the

  trunk:[1500,2300], segLen:64, jag:26,    /* trunk spans well past a screen, so it reads as sky-wide */
  forks:[3,6], forkLen:[0.22,0.52], forkJag:20, subChance:0.45

let stormBolts=[];
function segDistSq(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;

  t=t<0?0:(t>1?1:t);

/* random-walk polyline from a to b: steps along the axis, jittered perpendicular */
function jaggedPath(x0,y0,x1,y1,jag,segLen){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const n=Math.max(2,Math.round(L/segLen));
  const pts=[[x0,y0]];
  for(let i=1;i<n;i++){
    const t=i/n, w=Math.sin(t*Math.PI);         /* no wander at the endpoints */
    const off=rand(-jag,jag)*w;
    pts.push([x0+dx*t+px*off, y0+dy*t+py*off]);

/* trunk through (cx,cy) at a random heading, plus forks branching off it (some with sub-forks) */
function makeForkTree(cx,cy){
  const ang=rand(0,TAU), L=rand(BOLT.trunk[0],BOLT.trunk[1]);
  const ux=Math.cos(ang), uy=Math.sin(ang);
  const ax=cx-ux*L*0.5, ay=cy-uy*L*0.5, bx=cx+ux*L*0.5, by=cy+uy*L*0.5;
  const trunk=jaggedPath(ax,ay,bx,by,BOLT.jag,BOLT.segLen);
  const paths=[trunk];
  const nf=randi(BOLT.forks[0],BOLT.forks[1]);

    const i=randi(1,trunk.length-2), p=trunk[i];
    const side=Math.random()<0.5?1:-1;
    const fa=ang+side*rand(0.45,1.25);
    const fl=L*rand(BOLT.forkLen[0],BOLT.forkLen[1]);
    const ex=p[0]+Math.cos(fa)*fl, ey=p[1]+Math.sin(fa)*fl;
    const branch=jaggedPath(p[0],p[1],ex,ey,BOLT.forkJag,BOLT.segLen*0.8);
    paths.push(branch);
    if(Math.random()<BOLT.subChance && branch.length>3){
      const j=randi(1,branch.length-2), q=branch[j];

  /* streaks: how many infall streamlines, and how fast each one falls. rate is in traversals per
     second, so 0.05 == ~20 s to fall from Rcut to the inner edge. The star is deliberately the
     slower, lazier one; a black hole should still look like it is dragging matter down. */
  bh:   { A:0.77, n:3, Rcut:1050, Reh:150, kill:60,  fadeStart:0.9, swirl:2.6, infall:1.40, armR:1150, armSpin:0.055,
          maxPull:230, rMin:18,     /* maxPull caps the current; rMin stops the 1/r^3 singularity */
          streaks:18, streakRate:[0.085,0.170] },
  star: { A:21,   n:2, Rcut:700,  Reh:110, kill:44, burnR:200, burnDps:8,  fadeStart:0.9, swirl:1.7, infall:1.25,
          maxPull:200, photoDps:34,   /* photosphere: inside Reh you cook, worst at the core */
          streaks:16, streakRate:[0.040,0.080] }
};
function gravityAt(x,y){
  let vx=0, vy=0, insideReh=false, insideKill=false, burn=0, peak=0, depth=0, starDepth=0;
  for(const p of gravWorld){
    const F = p.k==="bhole" ? FIELD.bh : p.k==="star" ? FIELD.star : null;
    if(!F)continue;
    const dx=p.sx-x, dy=p.sy-y, rho2=dx*dx+dy*dy, rho=Math.sqrt(rho2)||1;
    /* BLACK HOLES are IN-PLANE bodies: the field, the horizon and the kill zone all use rho (the
       distance you can actually see and fly), NOT sqrt(rho^2+z^2). z remains a purely visual
       parallax parameter. Using the 3-D radius made z a hard FLOOR on r, so every hole with
       z > kill (72% of them, since zDepth ranges to 3.5*CAM_H) was silently inert — no damage, no
       enemy deaths — and the (rho/r) term drove the in-plane pull to ZERO at the centre, which is
       the "pen" you could float around inside. Stars keep the 3-D radius: they are volumes.       */
    const isBH = (p.k==="bhole");
    const r = isBH ? Math.max(rho, F.rMin||18) : Math.sqrt(rho2+p.z*p.z);
    if(r>=F.Rcut)continue;
    let fade=1;
    if(r>F.Rcut*F.fadeStart) fade = 1 - (r - F.Rcut*F.fadeStart)/(F.Rcut*(1-F.fadeStart));
    let speed = F.A * Math.pow(F.Rcut/r, F.n) * fade;
    /* Hard cap so the pull is a strong current, never an inescapable wall. */
    if(F.maxPull) speed = Math.min(speed, F.maxPull);
    const planeSpeed = isBH ? speed : speed * (rho/r);   /* no centre dead-zone for a black hole */
    vx += planeSpeed * (dx/rho);
    vy += planeSpeed * (dy/rho);
    if(planeSpeed>peak)peak=planeSpeed;
    if(F.Reh && r<F.Reh){ insideReh=true;
      const dRef=isBH?rho:r;
      depth=Math.max(depth, clamp((F.Reh-dRef)/(F.Reh*0.75),0,1));
      if(!isBH)starDepth=Math.max(starDepth, clamp((F.Reh-dRef)/(F.Reh*0.75),0,1)); }
    if(F.kill && r<F.kill) insideKill=true;
    if(F.burnR && r<F.burnR) burn=Math.max(burn,(F.burnR-r)/F.burnR);
  }
  return {vx,vy,insideReh,insideKill,burn,peak,depth,starDepth};
}

function initAudio(){ if(audio.ctx)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;

  o.type=type; o.frequency.setValueAtTime(freq,t); if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur*0.9);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gain,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+dur);

function musicStep(s,t){ const boss=bossesAlive>0;
  if(s%4===0){ mNote(mHz(33+M_BASS[(s/4)%M_BASS.length]),t,0.26,"triangle",0.55); }
  if(s%8===0){ mNote(150,t,0.12,"sine",0.6,46); }
  if(s%2===0){ mNote(mHz(60+M_SCALE[(s/2)%M_SCALE.length]+(boss?12:0)),t,boss?0.10:0.13,"square",0.14); }
  if(boss&&s%4===2){ mNote(mHz(72+M_SCALE[s%M_SCALE.length]),t,0.07,"sawtooth",0.10); }
  if(boss&&s%2===1){ mNote(mHz(90+M_SCALE[s%M_SCALE.length]),t,0.04,"square",0.06); } }
function musicTick(){ const c=audio.ctx; if(!c||!musicOn)return;
  const target=bossesAlive>0?150:96; audio.tempo+=(target-audio.tempo)*0.04;
  const spb=60/audio.tempo/4; let guard=0;
  while(audio.nextT<c.currentTime+0.1&&guard++<48){ musicStep(audio.step,audio.nextT); audio.nextT+=spb; audio.step=(audio.step+1)%32; }
  if(audio.nextT<c.currentTime)audio.nextT=c.currentTime+spb; }

function stationPhysics(){
  if(!cellStation||P.docked)return false;
  const ST=cfg.station, dx=P.x-cellStation.x, dy=P.y-cellStation.y, d=Math.hypot(dx,dy)||1;

  /* re-arm auto-dock only once the ship has actually left docking range */
  if(P.dockLatch && d>ST.dockR*1.35) P.dockLatch=false;

  /* auto-dock: cleared cell, in range, not still latched out from a recent undock */
  if(state==="playing" && !P.dockLatch && P.dockCd<=0 && cellCleared && d<ST.dockR){ doDock(); return true; }

  /* solid hull — a station is a collider whether or not you are allowed to dock */
  const minD=ST.hubR+P.radius;

    P.x=cellStation.x+nx*minD; P.y=cellStation.y+ny*minD; clampPlayerEdges();
    const vn=P.vx*nx+P.vy*ny; if(vn<0){ P.vx-=(1+rest)*vn*nx; P.vy-=(1+rest)*vn*ny; } }

  P.x=cellStation.x+nx*ST.dockR*1.15; P.y=cellStation.y+ny*ST.dockR*1.15; clampPlayerEdges();

function doSpawn(dt){

  if(feeding && spawnedCount>=spawnBudget) spawnBudget=spawnedCount+AMOEBA.preyTopUp;
  if(spawnedCount>=spawnBudget)return; spawnTimer-=dt;

/* THREAT MAP. Scores a candidate point in the current cell by everything that could kill you there.

   to prevent. Inverse-square-ish falloff so distant threats matter little and adjacency dominates. */

/* Sample a ring of candidate landings and return the safest direction+point. */

/* Fires the split the moment the hull drops to cfg.player.survive.trigger of max, so you leave

function survivorCheck(){

/* SURVIVOR eject. Intercepts a killing blow ONCE per run: the outer hull is abandoned as an inert

function survivorEject(){

  for(const k in ups) ups[k]=Math.floor((ups[k]||0)/2);      /* half your shard build, for now */
  /* the main gun comes along, but damaged: down 1-2 levels, never below 1 */
  const mid=P.slots.main;

  if(P.satWeapon)P.satWeaponLevels[P.satWeapon]=1;           /* repair satellites drop to Lv1 */

  rebuildHull(P.hullId||"survivor", false);        /* replay what's LEFT of the build */
  P.survivorUsed=true;                                       /* re-assert: clearPerks just reset it */
  P.shellDecoy={ isShell:true, dead:false, x:sx, y:sy, r:shellR, hp:shellHp, maxHp:shellHp, flash:0 };
  P.hp=P.maxHP*0.5;

}

  shopOffers.forEach((o,i)=>{ const afford=points>=o.cost, lv=upCount[o.u.id]||0;

function buyOffer(i){ const o=shopOffers[i]; if(!o||points<o.cost)return; points-=o.cost;
  o.u.fn(P); upCount[o.u.id]=(upCount[o.u.id]||0)+1;

  P.hp=Math.min(P.maxHP,P.hp+cfg.econ.repairAmt); renderShop(); }
function levelUpReward(){
